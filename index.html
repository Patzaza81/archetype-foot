<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F7F1E7">
<title>Archetype Foot — Accueil</title>
<link rel="stylesheet" href="style.css">
<style>
:root {
  --bg: #F7F1E7;
  --surface: #FFFDF8;
  --surface-2: #F1E9FA;
  --turquoise: #7C3AED;
  --turquoise-active: #5B21B6;
  --gold: #D4A72C;
  --green: #2F855A;
  --red: #C53030;
  --text: #241B35;
  --text-secondary: #756B7D;
  --heure: #655B70;
  --categorie: #7C3AED;
  --border: rgba(64,38,91,.14);
}

body {
  background: var(--bg);
  color: var(--text);
}

header {
  background: linear-gradient(135deg, rgba(79,70,229,.10), rgba(217,70,239,.10));
  border-bottom-color: rgba(124,58,237,.18);
}

header h1 { color: var(--gold); }

.nav-pages a,
.nav-bouton {
  background: linear-gradient(135deg, #4F46E5, #D946EF);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 5px 14px rgba(124,58,237,.18);
}

.nav-pages a:active,
.nav-bouton:active {
  background: linear-gradient(135deg, #4338CA, #C026D3);
  color: #fff;
}

.tabs button {
  background: #FFFDF8;
  color: var(--text);
  border-color: rgba(124,58,237,.16);
}

.tabs button.actif,
.bouton-principal,
#copier-btn {
  background: linear-gradient(135deg, #4F46E5, #D946EF);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 6px 16px rgba(124,58,237,.18);
}

.tabs button.actif { color: #fff; }
.bouton-principal:active,
#copier-btn:active { background: linear-gradient(135deg, #4338CA, #C026D3); }

.bouton-secondaire {
  background: #FFFDF8;
  color: var(--text);
  border-color: rgba(124,58,237,.18);
}

.match,
#sortie-json,
#ajout-manuel {
  background: var(--surface);
  border-color: var(--border);
  box-shadow: 0 5px 18px rgba(61,38,84,.06);
}

.score,
.proba-1,
.details-niveau1 summary,
.detail-sous-titre,
.justification-titre {
  color: #7C3AED;
}

.pari-ligne.pari-en-or,
.pari-en-or .pari-mise,
header h1 { color: var(--gold); }

.entete-categorie,
.selection-competition {
  background: #F1E9FA;
  color: #7C3AED;
}

input[type="checkbox"]:checked::after { border-color: #3B2454; }

#statut-analyse-panier.ok { color: var(--green); }
#statut-analyse-panier.erreur { color: var(--red); }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <h1>Archetype Foot</h1>
  </div>
  <p id="maj">Chargement…</p>
  <div id="nav-pages" class="nav-pages">
    <a id="nav-panier" href="panier.html">🧺 Panier (0)</a>
    <a id="nav-archetype" href="archetype.html">🎯 Sélections Archetype</a>
    <a id="nav-systeme" href="systeme.html">⚙️ Système</a>
  </div>
</header>
<main>
  <div id="onglets-jour" class="tabs">
    <button id="onglet-aujourdhui" class="actif" data-jour="aujourdhui">Aujourd'hui</button>
    <button id="onglet-demain" data-jour="demain">Demain</button>
  </div>
  <div id="liste"></div>
</main>
<script src="index.js"></script>
</body>
</html>
