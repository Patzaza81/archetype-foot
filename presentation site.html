<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Présentation site</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f8f3e8;color:#172e57;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,1100px);margin:0 auto;padding:24px 16px 48px}
    h1{margin:0 0 8px;font-size:28px}
    p{margin:0 0 24px;color:#667085}
    .prototype{margin:0 0 28px;padding:12px;background:#fdfbf7;border:1px solid #ddd7ca;border-radius:18px;box-shadow:0 8px 24px rgba(23,46,87,.08)}
    img{display:block;width:100%;height:auto;border-radius:12px}
    .label{padding:10px 4px 4px;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>Présentation site</h1>
    <p>Page temporaire de présentation des visuels prototypes. Elle pourra être supprimée après validation.</p>

    <section class="prototype">
      <div class="label">Prototype 1</div>
      <img src="IMG_6209.png" alt="Prototype 1">
    </section>

    <section class="prototype">
      <div class="label">Prototype 2</div>
      <img src="IMG_6229.png" alt="Prototype 2">
    </section>
  </main>
</body>
</html>
