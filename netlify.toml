[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# ANTI-CACHE GLOBAL : le navigateur et le CDN doivent toujours revalider
# les fichiers du site après chaque déploiement.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"
    Pragma = "no-cache"
    Expires = "0"
