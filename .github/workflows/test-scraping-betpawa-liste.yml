name: Test scraping Betpawa -- page de liste (ponctuel)

# Déclenchement UNIQUEMENT manuel -- pas de "schedule". Sert à répondre à
# une question précise avant de construire quoi que ce soit dessus : une
# page de liste Betpawa (events/group/...) contient-elle assez
# d'information pour identifier plusieurs matchs à la fois ?
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test-scraping-liste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Lancer le test
        run: python test_scraping_betpawa_liste.py

      - name: Committer le résultat pour inspection
        if: always()
        run: |
          git config user.name "archetype-foot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add diagnostic_liste_betpawa.txt || true
          git diff --staged --quiet || git commit -m "Diagnostic page de liste Betpawa"
          git pull --rebase origin main
          git push
