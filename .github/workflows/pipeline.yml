name: Pipeline quotidien Archetype Foot

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      panier_id:
        description: "Id du panier Supabase à analyser -- LAISSER VIDE pour relancer l'analyse complète du jour"
        required: false
        type: string
      jours:
        description: "Fenêtre traitée : 4 = aujourd'hui + demain + J+2 + J+3 ; 2 = aujourd'hui + demain"
        required: false
        type: choice
        default: "4"
        options:
          - "4"
          - "2"
      limite_betpawa:
        description: "VIDE = volume complet. Renseigner un nombre seulement pour plafonner explicitement."
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline-archetype-foot
  queue: max
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4 pandas lxml playwright pytest
          playwright install --with-deps chromium

      - name: Autotests du moteur, du pont et suite Python
        run: |
          python -m moteur_v2_6_10 --autotest
          python pont_moteur.py --autotest
          python -m pytest tests -q

      - name: Collecter et normaliser Football-Data
        run: python collecte_football_data.py
        continue-on-error: true

      - name: Générer les listes brutes aujourd'hui + demain
        run: python scraper.py --max-matchs 100000

      - name: Générer la liste J+2 à J+3
        if: github.event.inputs.jours != '2'
        run: python scraper_semaine.py --max-matchs 100000
        continue-on-error: true

      - name: Pré-calcul J0/J+1/J+2/J+3 + résolution Betpawa (indépendant du panier)
        id: precalcul
        env:
          PRECALCUL_LIMITE_BETPAWA: ${{ github.event.inputs.limite_betpawa }}
          PRECALCUL_JOURS: ${{ github.event.inputs.jours }}
        run: python precalcul.py
        continue-on-error: true

      - name: Vérifier que le pré-calcul a réellement produit un résultat exploitable
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: |
          if [ "${{ steps.precalcul.outcome }}" != "success" ]; then
            echo "ERREUR : l'étape précalcul a échoué -- arrêt AVANT publication."
            exit 1
          fi
          if [ ! -s precalcul_leger.json ]; then
            echo "ERREUR : precalcul_leger.json absent ou vide -- arrêt AVANT publication."
            exit 1
          fi
          echo "Pré-calcul vérifié OK."

      - name: Vérifier les résultats réels d'archetype_model (SELECTED + COUNTERFACTUAL)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python verifie_resultats_archetype_model.py
        continue-on-error: true

      - name: Enregistrer les scores réels dans l'historique
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python enregistre_scores_historique.py --jours 10
        continue-on-error: true

      - name: Récupérer les scores des matchs du jeu d'évaluation du moteur
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python evaluation_scores.py
        continue-on-error: true

      - name: Consolider l'état système pour la page systeme.html
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python construit_etat_systeme.py
        continue-on-error: true

      # CORRECTIF 03/10/2026 : le bloc précédent contenait un done sans boucle
      # for correspondante. Cela faisait échouer Bash après tout le traitement.
      - name: Commit et push du résultat
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: |
          set -e

          git config user.name "archetype-foot-bot"
          git config user.email "bot@users.noreply.github.com"

          # Nettoyage des artefacts Python temporaires avant publication.
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +

          # Le pipeline génère plusieurs fichiers et répertoires. On capture
          # TOUTES les modifications, y compris celles ajoutées pendant les
          # dernières étapes, afin de ne jamais laisser de changements locaux
          # entre le commit et le rebase.
          git add -A

          echo "--- état avant commit ---"
          git status --short

          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
            exit 0
          fi

          git commit -m "Mise à jour pipeline"

          # Le commit local doit être propre avant le rebase. Si un fichier
          # suivi a malgré tout été modifié entre git add et git commit,
          # --autostash protège le workspace au lieu de faire échouer le run.
          if [ -n "$(git status --porcelain)" ]; then
            echo "Modifications résiduelles détectées après commit :"
            git status --short
            git add -A
            git commit --amend --no-edit
          fi

          # Un autre run peut avoir publié pendant le traitement (notamment un run
          # de pipeline plus ancien). Les artefacts du run courant sont la version
          # voulue pour les fichiers qu'il vient de générer : résolution automatique
          # des conflits avec la version locale du commit rebased.
          git fetch origin main
          git pull --rebase -X theirs --autostash origin main
          git push origin HEAD:main

      - name: Notifier les constats majeurs (Issue GitHub, s'il y en a)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python notifie_constat_majeur.py
        continue-on-error: true
