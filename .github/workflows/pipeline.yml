name: Pipeline quotidien Archetype Foot

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      panier_id:
        description: "Id du panier Supabase à analyser -- LAISSER VIDE pour relancer l'analyse complète du jour"
        required: false
        type: string
      jours:
        description: "Fenêtre traitée : 4 = aujourd'hui + demain + J+2 + J+3 ; 2 = aujourd'hui + demain"
        required: false
        type: choice
        default: "4"
        options:
          - "4"
          - "2"
      limite_betpawa:
        description: "VIDE = volume complet. Renseigner un nombre seulement pour plafonner explicitement."
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline-archetype-foot
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4 pandas numpy lxml playwright pytest
          playwright install --with-deps chromium

      - name: Autotests du moteur, du pont et suite Python
        run: |
          python -m moteur_v2_6_10 --autotest
          python pont_moteur.py --autotest
          python -m pytest tests -q

      - name: Collecter et normaliser Football-Data
        run: python collecte_football_data.py
        continue-on-error: true

      - name: Générer les listes brutes aujourd'hui + demain
        run: python scraper.py --max-matchs 100000

      - name: Générer la liste J+2 à J+3
        if: github.event.inputs.jours != '2'
        run: python scraper_semaine.py --max-matchs 100000
        continue-on-error: true

      - name: Pré-calcul J0/J+1/J+2/J+3 + résolution Betpawa (indépendant du panier)
        id: precalcul
        env:
          PRECALCUL_LIMITE_BETPAWA: ${{ github.event.inputs.limite_betpawa }}
          PRECALCUL_JOURS: ${{ github.event.inputs.jours }}
        run: python precalcul.py
        continue-on-error: true

      - name: Vérifier que le pré-calcul a réellement produit un résultat exploitable
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: |
          if [ "${{ steps.precalcul.outcome }}" != "success" ]; then
            echo "ERREUR : l'étape précalcul a échoué -- arrêt AVANT publication."
            exit 1
          fi
          if [ ! -s precalcul_leger.json ]; then
            echo "ERREUR : precalcul_leger.json absent ou vide -- arrêt AVANT publication."
            exit 1
          fi
          echo "Pré-calcul vérifié OK."

      - name: Vérifier les résultats réels d'archetype_model (SELECTED + COUNTERFACTUAL)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python verifie_resultats_archetype_model.py
        continue-on-error: true

      - name: Enregistrer les scores réels dans l'historique
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python enregistre_scores_historique.py --jours 10
        continue-on-error: true

      - name: Ajouter l indice de performance aux marchés V2
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python v2_indice.py
        continue-on-error: true

      - name: Produire les pronostics V3 en production parallèle
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python moteur_v3_pipeline.py

      - name: Comparer V2.6.10 et V3 et publier le diagnostic
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python comparateur_moteurs.py

      - name: Moteur alpha séries (pronostics et journal gelé, hors tickets)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        continue-on-error: true
        run: python -m alpha_serie.suivi pipeline

      # AJOUT 27/10/2026 : moteur omega (croisements, scénario contradictoire, Poisson/Dixon-Coles calibré). Autonome, hors tickets,
      # journal gelé avant le coup d'envoi (data/omega/), page pronostics_omega.html. Ne bloque jamais le pipeline. Voir docs/MOTEUR_OMEGA.md.
      - name: Moteur omega (pronostics et journal gelé, hors tickets)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        continue-on-error: true
        run: python -m moteur_omega.suivi pipeline

      - name: Récupérer les scores des matchs du jeu d'évaluation du moteur
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python evaluation_scores.py
        continue-on-error: true

      # AJOUT 22/10/2026 : onglet « Meilleures sélections » (V2 et V3). Recalibrage hebdomadaire AUTOMATIQUE à partir des paris
      # gelés et de leurs résultats (voir meilleures_selections/regles.py). Après les scores, avant la publication. Ne bloque jamais.
      - name: Meilleures sélections V2 et V3 (recalibrage hebdomadaire automatique)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python -m meilleures_selections.suivi pipeline
        continue-on-error: true

      - name: Construire l intelligence de sélection multi-source
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python selection_adaptative.py

      - name: Générer les scénarios de tickets
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python generateur_tickets.py

      - name: Consolider l'état système pour la page systeme.html
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python construit_etat_systeme.py
        continue-on-error: true

      # AJOUT 11/10/2026 : archive de l'indice de performance (V2, V3, Journal) -> data/indices/ (voir docs/CLAUDE_ARCHIVE.md).
      # Après le générateur et l'état système (le suivi du générateur est à jour). Ne bloque jamais le pipeline.
      - name: Archiver l'indice de performance des paris (V2, V3, Journal)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python archive_indices.py
        continue-on-error: true

      # AJOUT 11/10/2026 : rubrique Corners & Cartons (modèle propre, séparé de V2/V3 ; voir docs/CORNERS_CARTONS.md).
      # Lit Football-Data (collecté plus haut) et precalcul.json ; écrit data/corners_cartons*.json. Ne bloque jamais le pipeline.
      - name: Produire les probabilités corners et cartons
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python corners_cartons.py
        continue-on-error: true

      # CORRECTIF 03/10/2026 : le bloc précédent contenait un done sans boucle
      # for correspondante. Cela faisait échouer Bash après tout le traitement.
      - name: Commit et push du résultat
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: |
          set -e

          git config user.name "archetype-foot-bot"
          git config user.email "bot@users.noreply.github.com"

          # Nettoyage des artefacts Python temporaires avant publication.
          find . -type d -name "__pycache__" -prune -exec rm -rf {} +

          # Capturer toutes les sorties produites par le run.
          git add -A

          echo "--- état avant commit ---"
          git status --short

          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
            exit 0
          fi

          git commit -m "Mise à jour pipeline"

          # Le run peut durer plusieurs heures : main peut donc avancer avant
          # la publication. On resynchronise et réessaie plusieurs fois.
          MON_COMMIT=$(git rev-parse HEAD)

          # CORRECTIF 12/10/2026 (audit) : le repli faisait `git checkout "$MON_COMMIT" -- .`, qui réécrit TOUS les
          # fichiers avec leur version du début du run. Un correctif de code fusionné sur main pendant le run (1 à 3 h)
          # aurait été annulé en silence. On ne remet plus que les fichiers que CE run a produits ou modifiés.
          FICHIERS_DU_RUN=$(mktemp)
          git diff --name-only -z "$MON_COMMIT~1" "$MON_COMMIT" > "$FICHIERS_DU_RUN"
          remet_artefacts_du_run() {
            git reset --hard origin/main
            if [ -s "$FICHIERS_DU_RUN" ]; then
              # Fichiers supprimés par le run : absents de MON_COMMIT, on les ignore (ils restent tels quels sur main).
              xargs -0 -a "$FICHIERS_DU_RUN" sh -c 'for f; do git cat-file -e "'"$MON_COMMIT"':$f" 2>/dev/null && git checkout "'"$MON_COMMIT"'" -- "$f"; done; true' sh
            fi
            git add -A
            git commit -m "Mise à jour pipeline" || true
          }

          for i in 1 2 3 4 5; do
            echo "--- tentative de publication $i/5 ---"
            git fetch origin main

            if ! git rebase -X theirs origin/main; then
              echo "Rebase impossible : repli sur origin/main + artefacts du run (seuls les fichiers produits par le run)."
              git rebase --abort || true
              remet_artefacts_du_run
            fi

            if git push origin HEAD:main; then
              echo "Publication réussie."
              exit 0
            fi

            echo "Push refusé (essai $i), nouvelle tentative."
            remet_artefacts_du_run
            sleep $((i * 10))
          done

          echo "::error::Impossible de publier après 5 essais."
          exit 1

      - name: Notifier les constats majeurs (Issue GitHub, s'il y en a)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python notifie_constat_majeur.py
        continue-on-error: true
