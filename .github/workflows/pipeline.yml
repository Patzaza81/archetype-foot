name: Pipeline quotidien Archetype Foot

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      panier_id:
        description: "Id du panier Supabase à analyser -- LAISSER VIDE pour relancer l'analyse complète du jour (équivalent du run planifié, sans attendre le prochain cron)"
        required: false
        type: string
      limite_betpawa:
        description: "02/09/2026 -- nombre max de matchs Betpawa dans precalcul.py. VIDE = valeur par défaut prudente (100), utilisée aussi automatiquement par le cron nocturne tant que le plein volume n'est pas validé en routine. Pour tester le VRAI volume illimité (déjà testé le 02/09 : 1574 matchs, 5h18m, proche de la limite de 6h de GitHub), taper le mot illimite (sans accent)."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pipeline-archetype-foot
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4 pandas lxml playwright
          playwright install --with-deps chromium

      - name: Générer les listes brutes aujourd'hui + demain
        run: python scraper.py --max-matchs 100000

      - name: Générer la liste J+2 à J+7
        run: python scraper_semaine.py --max-matchs 100000
        continue-on-error: true

      - name: Récupérer les matchs Betpawa (betpawa_urls.txt)
        run: python scraper_betpawa.py
        continue-on-error: true

      # CORRECTIF 02/09/2026 (2e application -- la 1re n'avait pas pris) :
      # le cron (schedule) ne fournit JAMAIS github.event.inputs.limite_betpawa
      # (existe seulement sur workflow_dispatch) -- sans le "|| '100'", ça
      # donne une chaîne vide = AUCUNE limite. Confirmé en conditions réelles
      # le 02/09 : run de 5h18m51s sur 1574 matchs, à 40 min du mur des 6h de
      # GitHub Actions. Défaut sûr désormais : 100, pour le cron ET pour un
      # déclenchement manuel où le champ est laissé vide. Taper "illimite"
      # dans le champ pour forcer explicitement le plein volume (déjà testé,
      # fonctionne, mais proche de la limite).
      - name: Pré-calcul J+1/J+2/J+3 + résolution Betpawa (indépendant du panier)
        env:
          PRECALCUL_LIMITE_BETPAWA: ${{ github.event.inputs.limite_betpawa || '100' }}
        run: python precalcul.py
        continue-on-error: true

      - name: Pipeline planifié ou relance manuelle complète (panier_id vide)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python run_pipeline.py

      - name: Pipeline déclenché manuellement (panier Supabase, panier_id renseigné)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id != ''
        env:
          INPUT_PANIER_ID: ${{ github.event.inputs.panier_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python dispatch_pipeline.py

      - name: Vérifier les scores des jours précédents
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python verification_resultats.py

      - name: Commit et push du résultat (run planifié ou relance manuelle complète)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: |
          git config user.name "archetype-foot-bot"
          git config user.email "bot@users.noreply.github.com"

          # DIAGNOSTIC 03/09/2026 -- precalcul_leger.json est écrit avec
          # succès par precalcul.py (confirmé : le print "precalcul_leger.json
          # écrit en parallèle" apparaît dans le log de CETTE session, donc
          # après l'écriture réussie du fichier) mais n'a jamais été retrouvé
          # dans les commits produits ensuite, alors que le mécanisme git add
          # lui-même fonctionne (historique_pronostics.json, ajouté par la
          # même boucle, se met bien à jour à chaque run). Recherche de code
          # menée avant ce correctif : aucun os.remove/shutil, aucun git
          # clean/checkout/reset caché dans precalcul.py, run_pipeline.py,
          # verification_resultats.py ou ce workflow -- rien trouvé. Ces
          # lignes tranchent la seule question qui reste ouverte : le fichier
          # est-il présent sur le disque à CET instant précis, juste avant le
          # git add.
          echo "--- diagnostic precalcul_leger.json : état avant git add ---"
          ls -la precalcul_leger.json precalcul.json historique_pronostics.json 2>&1 || true
          echo "--- git status avant add ---"
          git status --porcelain

          git add data.json matchs_du_jour.json matchs_demain.json matchs_semaine.json precalcul.json cache_equipes.json cache_betpawa.json diagnostic_precalcul_betpawa.txt
          # CORRECTIF 03/09/2026 : precalcul_leger.json (nouveau fichier depuis
          # la session du 02/09, cf TRANSITION.md 17.5) était généré par
          # precalcul.py mais absent de cette liste -- jamais commité, donc
          # jamais servi par le site (404 permanent quel que soit le succès
          # du run). Ajouté dans la boucle conditionnelle car le fichier peut
          # ne pas exister si l'étape précalcul échoue (continue-on-error).
          for f in panier.json historique_pronostics.json precalcul_leger.json; do
            [ -f "$f" ] && git add "$f"
          done

          echo "--- diagnostic precalcul_leger.json : git status après add ---"
          git status --porcelain

          git diff --staged --quiet || git commit -m "Mise à jour pipeline"
          git pull --rebase origin main
          git push
