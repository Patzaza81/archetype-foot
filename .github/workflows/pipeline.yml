name: Pipeline quotidien Archetype Foot

on:
  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:
    inputs:
      panier_id:
        description: "Id du panier Supabase à analyser"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pipeline-archetype-foot
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4 pandas lxml playwright
          playwright install --with-deps chromium

      - name: Générer les listes brutes aujourd'hui + demain
        run: python scraper.py --max-matchs 200

      - name: Générer la liste J+2 à J+7
        run: python scraper_semaine.py --max-matchs 100000
        continue-on-error: true

      - name: Récupérer les matchs Betpawa (betpawa_urls.txt)
        run: python scraper_betpawa.py
        continue-on-error: true

      - name: Pipeline planifié (ancien chemin)
        if: github.event_name == 'schedule'
        run: python run_pipeline.py

      - name: Pipeline déclenché manuellement (panier envoyé depuis le site)
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_PANIER_ID: ${{ github.event.inputs.panier_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python dispatch_pipeline.py

      - name: Vérifier les scores des jours précédents
        if: github.event_name == 'schedule'
        run: python verification_resultats.py

      - name: Commit et push du résultat (run planifié uniquement)
        if: github.event_name == 'schedule'
        run: |
          git config user.name "archetype-foot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json matchs_du_jour.json matchs_demain.json matchs_semaine.json
          for f in panier.json historique_pronostics.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Mise à jour pipeline"
          git pull --rebase origin main
          git push
