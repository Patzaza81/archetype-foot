name: Pipeline quotidien Archetype Foot

on:
  schedule:
    # MODIFIÉ 12/09/2026 (demande de Patrick) : passé de 00:00 à 21:00 UTC
    # (= 22:00 à Douala, Cameroun, UTC+1 -- heure locale visée, confirmée par
    # Patrick). 00:00 UTC est l'heure la plus demandée sur GitHub Actions
    # (beaucoup de pipelines planifiés pile à minuit) -- le run réel du
    # 12/09 a démarré à 02:28 UTC, soit 2h28 de retard sur les 00:00
    # planifiés (confirmé par le log Actions fourni par Patrick).
    - cron: "0 21 * * *"

  workflow_dispatch:
    inputs:
      panier_id:
        description: "Id du panier Supabase à analyser -- LAISSER VIDE pour relancer l'analyse complète du jour (équivalent du run planifié, sans attendre le prochain cron)"
        required: false
        type: string
      limite_betpawa:
        description: "03/09/2026 -- CORRECTIF : plus de limite par défaut (voir run #91, 33m37s total avec le filtre de compétitions actif, large marge sous les 6h de GitHub). VIDE = volume complet, utilisé aussi par le cron nocturne. Renseigne un nombre ici seulement si tu veux explicitement RE-plafonner (ex. pour un test)."
        required: false
        type: string

permissions:
  contents: write
  # AJOUT 13/09/2026 -- nécessaire à notifie_constat_majeur.py, qui crée
  # une Issue via `gh issue create` uniquement quand un événement notable
  # a été signalé cette nuit (promotion réelle, premier vrai ticket).
  issues: write

concurrency:
  group: pipeline-archetype-foot
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4 pandas lxml playwright
          playwright install --with-deps chromium

      - name: Générer les listes brutes aujourd'hui + demain
        run: python scraper.py --max-matchs 100000

      - name: Générer la liste J+2 à J+3
        run: python scraper_semaine.py --max-matchs 100000
        continue-on-error: true

      # CORRECTIF 06/09/2026 (Groupe 1, bugs #23/#40/#22) -- scraper_betpawa.py
      # lisait betpawa_urls.txt (ancien mécanisme manuel, retiré le 06/09 en
      # même temps que betpawa.html/betpawa.js) et alimentait panier.json/
      # data.json, un chemin mort en pratique tant que Supabase est configuré
      # (data.json n'est plus lu par personne côté site -- voir script.js).
      # Étape supprimée : le moteur automatique (precalcul.py, ci-dessous)
      # couvre déjà tous les matchs J0-J+3 via resolution_betpawa_precalcul.py.

      # CORRECTIF 03/09/2026 : plafond de 100 supprimé. Le run #91 (filtre
      # de compétitions actif, cap à 100) a tourné en 33m37s total -- très
      # loin des 6h de GitHub Actions, y compris en comptant que la fenêtre
      # s'élargit désormais à J0 (aujourd'hui) en plus de J+1/J+2/J+3.
      # PRECALCUL_LIMITE_BETPAWA vide/absent = pas de limite (comportement
      # documenté dans resolution_betpawa_precalcul.py). Le champ
      # limite_betpawa du workflow_dispatch, s'il est laissé vide (cas normal
      # ET cas du cron, qui ne le fournit jamais), donne bien une chaîne
      # vide ici -- pas besoin de "|| '100'" ni d'aucune valeur par défaut.
      - name: Pré-calcul J0/J+1/J+2/J+3 + résolution Betpawa (indépendant du panier)
        id: precalcul
        env:
          PRECALCUL_LIMITE_BETPAWA: ${{ github.event.inputs.limite_betpawa }}
        run: python precalcul.py
        continue-on-error: true

      # CORRECTIF 06/09/2026 (Groupe 2, bug #10) -- continue-on-error sur
      # l'étape précalcul ci-dessus empêchait déjà le job de s'arrêter tout
      # seul en cas de plantage, mais rien ne vérifiait ensuite que le
      # résultat était réellement exploitable. Cette garde n'a PAS
      # continue-on-error : si elle échoue (exit 1), le job s'arrête ici,
      # aucune étape suivante ne s'exécute -- ni la vérification des
      # résultats archetype_model, ni le bilan, ni la calibration, ni le
      # commit. Choix assumé (décision Patrick) : sécurité avant
      # complétude -- ces étapes traitent de toute façon un arriéré, elles
      # rattraperont au prochain run réussi. scraper_semaine.py reste
      # volontairement HORS de cette garde (continue-on-error ci-dessus
      # non retiré) : une dégradation de la couverture J+2/J+3 n'est pas
      # une donnée corrompue, contrairement à un échec de precalcul.py.
      - name: Vérifier que le pré-calcul a réellement produit un résultat exploitable (uniquement si schedule/relance complète)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: |
          if [ "${{ steps.precalcul.outcome }}" != "success" ]; then
            echo "ERREUR : l'étape précalcul a échoué (continue-on-error l'a seulement empêchée d'arrêter le job immédiatement) -- arrêt AVANT toute publication."
            exit 1
          fi
          if [ ! -s precalcul_leger.json ]; then
            echo "ERREUR : precalcul_leger.json absent ou vide après un précalcul pourtant marqué réussi -- arrêt AVANT publication."
            exit 1
          fi
          echo "Pré-calcul vérifié OK -- precalcul_leger.json présent et non vide."

      # RETIRÉ le 13/09/2026, décision de Patrick -- "Pipeline déclenché
      # manuellement (panier Supabase)" (dispatch_pipeline.py),
      # "Vérifier les scores des jours précédents" (verification_resultats.py)
      # et "Calculer le ROI" (calcule_roi.py) : le panier n'utilise plus la
      # saisie manuelle de cotes ni de run à la demande -- sa nouvelle
      # fonction (afficher les sélections déjà calculées d'un match choisi,
      # voir panier.html/panier.js) n'a plus besoin de ce backend. Fichiers
      # laissés en place (dispatch_pipeline.py, run_pipeline.py,
      # verification_resultats.py, calcule_roi.py) mais plus jamais
      # appelés depuis ce pipeline -- suppression physique envisagée dans
      # une passe séparée une fois confirmé que rien d'autre n'en dépend.

      # Résout SELECTED et COUNTERFACTUAL avec la même fonction de
      # règlement (reglement.py) -- doit tourner après l'archivage du run
      # courant (déjà fait dans precalcul.py) pour pouvoir vérifier aussi
      # les matchs qui viennent d'être joués cette nuit. Un échec
      # (scraping indisponible) ne doit jamais bloquer le pipeline --
      # continue-on-error, même logique que les autres étapes de
      # vérification/calcul de ce fichier.
      - name: Vérifier les résultats réels d'archetype_model (SELECTED + COUNTERFACTUAL)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python verifie_resultats_archetype_model.py
        continue-on-error: true

      # AJOUT 13/09/2026, demande explicite de Patrick ("branché le plus
      # tôt possible, dès le prochain run") -- mode observation des
      # tickets (Option A) : construit un ticket FICTIF par nuit avec un
      # seuil d'observations abaissé (tickets/observation.py,
      # SEUIL_OBSERVATION=10), jamais présenté comme un vrai ticket,
      # jamais dans archive/. Résout aussi les tickets fictifs des nuits
      # précédentes -- doit tourner APRÈS la vérification ci-dessus, sinon
      # les scores tout juste trouvés ne seraient pas encore là. Le seuil
      # RÉEL de tickets/builder.py (100 observations) n'est jamais modifié
      # par cette étape.
      - name: Mode observation des tickets (fictifs, seuil abaissé)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python observe_tickets_archetype_model.py
        continue-on-error: true

      # AJOUT 13/09/2026 -- tente la construction de VRAIS tickets, avec
      # le seuil réel INCHANGÉ de tickets/builder.py (100 observations
      # conjointes). Un résultat vide est normal et attendu pendant
      # probablement plusieurs mois -- ce script existe pour détecter,
      # sans intervention, le jour où ça change (voir constat_majeur.py).
      - name: Tentative de construction de vrais tickets (seuil réel, jamais assoupli)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python genere_tickets_reels_archetype_model.py
        continue-on-error: true

      # AJOUT 13/09/2026 -- construit le bilan comportemental à partir de
      # l'archive résolue ci-dessus (lecture seule, aucun scraping,
      # rejouable à volonté). Purement descriptif (cahier des charges v2
      # §6.3) : reste purement descriptif -- ne pilote aucune décision par
      # lui-même. Doit tourner après l'étape de vérification ci-dessus,
      # jamais avant.
      - name: Construire le bilan comportemental d'archetype_model
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python calcule_matrice_archetype_model.py
        continue-on-error: true

      # AJOUT 13/09/2026, feu vert explicite de Patrick -- dernière étape
      # de la boucle de calibration adaptative (cahier des charges v2 §7,
      # Addendum 2). Enchaîne garde_fous -> validation hors échantillon ->
      # promotion/rejet pour chacun des 7 paramètres testables par
      # contrefactuel.py, journalise systématiquement (même sans
      # promotion). Doit tourner après le bilan comportemental ci-dessus,
      # qui doit lui-même tourner après la vérification des résultats.
      # convergence.py/robustness.py lisent désormais cette configuration
      # (voir archetype_model/config_loader.py) -- une promotion ici a un
      # effet réel sur le prochain cycle de sélection.
      - name: Calibration adaptative d'archetype_model
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python calibre_archetype_model.py
        continue-on-error: true

      # AJOUT 13/09/2026 -- consolide en un seul fichier (etat_systeme.json)
      # ce que la nouvelle page systeme.html affiche : bilan comportemental,
      # paramètres calibrés, dernières promotions, rapport des tickets
      # fictifs. Lecture seule, aucun calcul nouveau -- doit tourner APRÈS
      # calibre_archetype_model.py et observe_tickets_archetype_model.py
      # (a besoin de leurs résultats à jour), et AVANT le commit ci-dessous
      # (sinon etat_systeme.json ne serait jamais publié).
      - name: Consolider l'état système pour la page systeme.html
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python construit_etat_systeme.py
        continue-on-error: true

      - name: Commit et push du résultat (run planifié ou relance manuelle complète)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: |
          echo "=================================================="
          echo "DIAGNOSTIC 18.1 -- AVANT git add"
          echo "=================================================="
          echo "--- pwd ---"
          pwd
          echo "--- ls -la du répertoire courant ---"
          ls -la
          echo "--- ls -la ciblé sur precalcul_leger.json ---"
          ls -la precalcul_leger.json 2>&1 || echo "==> ABSENT DU DISQUE avant git add"
          echo "--- git status --porcelain (avant) ---"
          git status --porcelain
          echo "=================================================="

          git config user.name "archetype-foot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json matchs_du_jour.json matchs_demain.json matchs_semaine.json precalcul.json cache_equipes.json cache_betpawa.json diagnostic_precalcul_betpawa.txt
          # CORRECTIF 03/09/2026 : precalcul_leger.json (nouveau fichier depuis
          # la session du 02/09, cf TRANSITION.md 17.5) était généré par
          # precalcul.py mais absent de cette liste -- jamais commité, donc
          # jamais servi par le site (404 permanent quel que soit le succès
          # du run). Ajouté dans la boucle conditionnelle car le fichier peut
          # ne pas exister si l'étape précalcul échoue (continue-on-error).
          # AJOUT 03/09/2026 : matchs_du_jour_filtre.json et
          # matchs_demain_filtre.json -- Patrick a signalé que le filtre de
          # compétitions ne touchait que precalcul.json/precalcul_leger.json
          # (le pipeline automatique), pas les listes affichées sur l'accueil
          # pour la sélection manuelle du panier. Ces 2 nouveaux fichiers sont
          # des copies filtrées de matchs_du_jour.json/matchs_demain.json,
          # générées par precalcul.py -- les fichiers bruts restent
          # committés tels quels juste au-dessus (run_pipeline.py en a besoin
          # intacts pour résoudre un match ajouté manuellement au panier,
          # même hors filtre).
          for f in panier.json historique_pronostics.json precalcul_leger.json matchs_du_jour_filtre.json matchs_demain_filtre.json cache_classement.json cache_h2h.json roi_dashboard.json bilan_archetype_model.json etat_systeme.json; do
            [ -f "$f" ] && git add "$f"
          done
          # AJOUT 13/09/2026 -- archive/ (archetype_model/learning/archive.py)
          # contient les fichiers archive/YYYY-MM.json, un nom de fichier
          # différent chaque mois -- `git add` sur le dossier entier plutôt
          # que sur une liste de noms fixes, comme pour les autres fichiers
          # ci-dessus. Le dossier peut ne pas encore exister au tout premier
          # run (aucun match archivé) -- ne jamais faire échouer le commit
          # pour ça.
          [ -d archive ] && git add archive/
          # AJOUT 13/09/2026 -- config/ contient adaptive_parameters.json
          # (les valeurs calibrées), adaptive_state.json (l'état actif) et
          # les deux journaux (cycle + promotion, calibre_archetype_model.py)
          # -- sans ce commit, chaque promotion serait perdue au run suivant.
          [ -d config ] && git add config/
          # AJOUT 13/09/2026 -- tickets_observes/ contient les tickets
          # fictifs du mode observation (observe_tickets_archetype_model.py)
          # -- sans ce commit, chaque ticket construit serait perdu au run
          # suivant, impossible de suivre sa résolution le lendemain.
          [ -d tickets_observes ] && git add tickets_observes/
          # AJOUT 13/09/2026 -- vrais_tickets/ ne contient normalement rien
          # pendant probablement plusieurs mois (seuil réel de
          # tickets/builder.py) -- ajouté par cohérence avec archive/config/
          # tickets_observes/ ci-dessus, jamais un échec si le dossier
          # n'existe pas encore.
          [ -d vrais_tickets ] && git add vrais_tickets/
          # AJOUT 17/09/2026 (chantier module d'audit, archetype_model/audit/)
          # -- data/ contient audit_status.json (dashboard) et
          # audit_telemetry.json (historique de rétention par run + Brier
          # score) écrits par telemetry.py/report.py en fin de
          # applique_archetype_model(). Sans ce commit, ces fichiers ne
          # quittent jamais le runner éphémère -- admin.html afficherait un
          # état vide en permanence, quel que soit le succès du run.
          [ -d data ] && git add data/

          echo "=================================================="
          echo "DIAGNOSTIC 18.1 -- APRÈS git add"
          echo "=================================================="
          echo "--- ls -la ciblé sur precalcul_leger.json ---"
          ls -la precalcul_leger.json 2>&1 || echo "==> ABSENT DU DISQUE après git add"
          echo "--- git status --porcelain (après add, avant commit) ---"
          git status --porcelain
          echo "=================================================="

          git diff --staged --quiet || git commit -m "Mise à jour pipeline"
          git pull --rebase origin main
          git push

      # AJOUT 13/09/2026, demande explicite de Patrick ("qui me
      # signalera ?") -- DOIT être la toute dernière étape du pipeline,
      # après tous les scripts susceptibles d'avoir signalé un événement
      # (calibre_archetype_model.py, genere_tickets_reels_archetype_model.py).
      # Une nuit sans événement notable n'ouvre aucune Issue -- silence
      # normal, pas une absence de fonctionnement.
      - name: Notifier les constats majeurs (Issue GitHub, s'il y en a)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python notifie_constat_majeur.py
        continue-on-error: true
