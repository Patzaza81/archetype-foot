name: Pipeline quotidien Archetype Foot

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4 pandas lxml

      - name: Générer la liste brute des matchs du jour (pour la page de sélection)
        run: |
          python scraper.py --max-matchs 200 --sortie matchs_du_jour.json
          echo "--- Aperçu ---"
          head -c 500 matchs_du_jour.json

      - name: Lancer le pipeline complet (matchs sélectionnés uniquement)
        run: python run_pipeline.py

      - name: Commit et push du résultat
        run: |
          git config user.name "archetype-foot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json matchs_du_jour.json
          git diff --staged --quiet || git commit -m "Mise à jour quotidienne des données"
          git pull --rebase origin main
          git push
