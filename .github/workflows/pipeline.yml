name: Pipeline quotidien Archetype Foot

on:
  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:
    inputs:
      equipe_dom:
        description: "Équipe à domicile"
        required: true
        type: string
      equipe_ext:
        description: "Équipe à l'extérieur"
        required: true
        type: string
      date:
        description: "Date du match au format YYYY-MM-DD"
        required: true
        type: string
      heure:
        description: "Heure du match au format HH:MM"
        required: true
        type: string
      url_matchendirect:
        description: "URL Matchendirect de secours (facultative)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4 pandas lxml playwright
          playwright install --with-deps chromium

      - name: Générer les listes brutes aujourd'hui + demain
        if: github.event_name == 'schedule'
        run: |
          python scraper.py --max-matchs 200

      - name: Générer la liste J+2 à J+7
        if: github.event_name == 'schedule'
        run: python scraper_semaine.py --max-matchs 100000
        continue-on-error: true

      - name: Récupérer les matchs Betpawa (betpawa_urls.txt)
        if: github.event_name == 'schedule'
        run: python scraper_betpawa.py
        continue-on-error: true

      - name: Pipeline planifié (ancien chemin, inchangé)
        if: github.event_name == 'schedule'
        run: python run_pipeline.py

      - name: Pipeline déclenché manuellement (nouveau canal)
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_EQUIPE_DOM: ${{ github.event.inputs.equipe_dom }}
          INPUT_EQUIPE_EXT: ${{ github.event.inputs.equipe_ext }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_HEURE: ${{ github.event.inputs.heure }}
          INPUT_URL_MD: ${{ github.event.inputs.url_matchendirect }}
        run: python dispatch_pipeline.py

      - name: Commit et push du résultat
        run: |
          git config user.name "archetype-foot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json matchs_du_jour.json matchs_demain.json matchs_semaine.json
          for f in panier.json historique_pronostics.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Mise à jour pipeline"
          git pull --rebase origin main
          git push
