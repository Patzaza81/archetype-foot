name: Pipeline quotidien Archetype Foot

on:
  schedule:
    # 30/08/2026 : passé de 7h UTC (8h à Douala) à 0h UTC = 1h à Douala
    # (UTC+1, pas d'heure d'été) -- Patrick veut que l'analyse du jour soit
    # déjà prête au réveil, pas déclenchée après. GitHub Actions programme
    # toujours ses cron en UTC, jamais dans un fuseau local -- à revoir si
    # Patrick change de fuseau.
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      panier_id:
        description: "Id du panier Supabase à analyser -- LAISSER VIDE pour relancer l'analyse complète du jour (équivalent du run planifié, sans attendre le prochain cron)"
        required: false
        type: string
      limite_betpawa:
        description: "01/09/2026 -- TEST : nombre max de matchs à faire passer par la résolution Betpawa dans precalcul.py (laisser vide = pas de limite, plein volume 600-800 matchs, JAMAIS TESTÉ à ce jour). Mettre 15 pour un premier test prudent."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pipeline-archetype-foot
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4 pandas lxml playwright
          playwright install --with-deps chromium

      # CORRECTIF 31/08/2026 : --max-matchs 200 tronquait réellement la liste
      # (matchs_du_jour.json/matchs_demain.json plafonnés à 200 chacun,
      # confirmé). Aligné sur scraper_semaine.py qui utilise déjà 100000
      # (= pas de limite pratique) pour ne perdre aucun match du jour/demain.
      - name: Générer les listes brutes aujourd'hui + demain
        run: python scraper.py --max-matchs 100000

      - name: Générer la liste J+2 à J+7
        run: python scraper_semaine.py --max-matchs 100000
        continue-on-error: true

      - name: Récupérer les matchs Betpawa (betpawa_urls.txt)
        run: python scraper_betpawa.py
        continue-on-error: true

      # AJOUT 01/09/2026 : PRECALCUL_LIMITE_BETPAWA vient de l'input manuel
      # limite_betpawa -- vide sur un run planifié (schedule), donc pas de
      # limite en production tant que ce n'est pas voulu explicitement.
      # continue-on-error: true conservé -- ce mode reste en observation.
      - name: Pré-calcul J+1/J+2/J+3 + résolution Betpawa (indépendant du panier)
        env:
          PRECALCUL_LIMITE_BETPAWA: ${{ github.event.inputs.limite_betpawa }}
        run: python precalcul.py
        continue-on-error: true

      - name: Pipeline planifié ou relance manuelle complète (panier_id vide)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python run_pipeline.py

      - name: Pipeline déclenché manuellement (panier Supabase, panier_id renseigné)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id != ''
        env:
          INPUT_PANIER_ID: ${{ github.event.inputs.panier_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python dispatch_pipeline.py

      - name: Vérifier les scores des jours précédents
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: python verification_resultats.py

      - name: Commit et push du résultat (run planifié ou relance manuelle complète)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.panier_id == '')
        run: |
          git config user.name "archetype-foot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json matchs_du_jour.json matchs_demain.json matchs_semaine.json precalcul.json cache_equipes.json cache_betpawa.json diagnostic_precalcul_betpawa.txt
          for f in panier.json historique_pronostics.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Mise à jour pipeline"
          git pull --rebase origin main
          git push
