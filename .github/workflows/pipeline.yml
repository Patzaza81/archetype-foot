name: Pipeline quotidien Archetype Foot

on:
  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:
    inputs:
      equipe_dom:
        description: "Équipe à domicile"
        required: true
        type: string

      equipe_ext:
        description: "Équipe à l'extérieur"
        required: true
        type: string

      date:
        description: "Date du match au format YYYY-MM-DD"
        required: true
        type: string

      heure:
        description: "Heure du match au format HH:MM"
        required: true
        type: string

      url_matchendirect:
        description: "URL Matchendirect de secours (facultative pendant la migration)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4 pandas lxml playwright
          playwright install --with-deps chromium

      - name: Générer les listes brutes aujourd'hui + demain (pour la page de sélection)
        run: |
          python scraper.py --max-matchs 200
          echo "--- Aperçu aujourd'hui ---"
          head -c 500 matchs_du_jour.json
          echo "--- Aperçu demain ---"
          head -c 500 matchs_demain.json

      - name: Générer la liste J+2 à J+7 (via navigateur, contourne le blocage HTTP simple)
        # continue-on-error : fonctionnalité annexe (aide la recherche
        # automatique d'URL matchendirect pour les matchs Betpawa) -- son
        # échec ne doit jamais empêcher le pipeline principal de tourner.
        run: python scraper_semaine.py --max-matchs 100000
        continue-on-error: true

      - name: Récupérer les matchs Betpawa listés dans betpawa_urls.txt
        # continue-on-error : un souci sur cette étape (site Betpawa qui a
        # changé, une URL invalide) ne doit jamais empêcher le pipeline
        # matchendirect de tourner normalement pour le reste des matchs.
        run: python scraper_betpawa.py
        continue-on-error: true

      - name: Lancer le pipeline complet (matchs sélectionnés uniquement)
        run: python run_pipeline.py

      - name: Commit et push du résultat
        run: |
          git config user.name "archetype-foot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json matchs_du_jour.json matchs_demain.json matchs_semaine.json
          # panier.json et historique_pronostics.json ne sont écrits par
          # run_pipeline.py QUE s'il y avait au moins un match à traiter
          # (voir run_pipeline.py::main) -- peuvent donc ne pas exister sur
          # un run à vide. `git add` sur un chemin absent ferait échouer le
          # step (shell en mode -e par défaut sur GitHub Actions).
          for f in panier.json historique_pronostics.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Mise à jour quotidienne des données"
          git pull --rebase origin main
          git push
