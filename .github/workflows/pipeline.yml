def est_hors_top_flight_unique(nom_competition):
    c = (nom_competition or "").replace("\n", " ")
    if any(pays in c and comp in c for pays, comp in COMPETITIONS_FEMMES_AUTORISEES):
        return False
    if any(m in c.lower() for m in ("femme", "femin", "fémin")):
        return False
    if ":" not in c:
        return False
    pays_brut, comp_brut = c.split(":", 1)
    pays_brut = pays_brut.strip()
    comp = " ".join(comp_brut.split())
    if pays_brut not in TOP_FLIGHT_UNIQUE_PAR_PAYS:
        return False  # pays hors de ce bloc (déjà traité ailleurs -- les 17 pays à paliers multiples)
    attendu = TOP_FLIGHT_UNIQUE_PAR_PAYS[pays_brut]
    if attendu is None:
        return True  # zone toujours exclue (confédération continentale, ou Malte)
    # CORRECTIF 03/09/2026 -- certaines zones autorisent PLUSIEURS
    # compétitions (ex. "Europe" : Ligue des Champions + Europa +
    # Conférence) -- valeur en tuple dans ce cas, pas une seule chaîne.
    if isinstance(attendu, tuple):
        return not any(comp.startswith(motif) for motif in attendu)
    # CORRECTIF 03/09/2026 -- "Super Ligue" (Grèce, Serbie, gardé) est
    # aussi le début de "Super Ligue 2" (2e échelon, à exclure) -- même
    # collision que "Ligue Nationale"/"Ligue Nationale Nord" en Angleterre.
    if attendu == "Super Ligue" and comp.startswith("Super Ligue 2"):
        return True
    return not comp.startswith(attendu)


def dates_j2_j3(aujourdhui=None):
    aujourdhui = aujourdhui or datetime.date.today()
    return {
        (aujourdhui + datetime.timedelta(days=2)).isoformat(),
        (aujourdhui + datetime.timedelta(days=3)).isoformat(),
    }


def date_j1(aujourdhui=None):
    aujourdhui = aujourdhui or datetime.date.today()
    return (aujourdhui + datetime.timedelta(days=1)).isoformat()


def charge_matchs_fenetre():
    matchs_demain = charge_json_ou_vide(FICHIER_MATCHS_DEMAIN, defaut=[])
    matchs_semaine = charge_json_ou_vide(FICHIER_MATCHS_SEMAINE, defaut=[])

    cibles = dates_j2_j3()
    matchs_j2_j3 = [m for m in matchs_semaine if m.get("date") in cibles]

    vus = set()
    fenetre = []
    for m in matchs_demain + matchs_j2_j3:
        mid = m.get("match_id")
        if not mid or mid in vus:
            continue
        vus.add(mid)
        fenetre.append(m)

    # AJOUT 03/09/2026 -- filtre jeunes/réserves, appliqué ici pour que ces
    # matchs ne consomment ni tentative Betpawa ni appel réseau dans
    # construit_signaux (voir docstring pour la mesure d'impact).
    nb_avant_filtre = len(fenetre)
    fenetre = [m for m in fenetre if not est_jeune_ou_reserve(m.get("competition"))]
    nb_exclus_jeunes_reserves = nb_avant_filtre - len(fenetre)

    # AJOUT 03/09/2026 (2e partie) -- liste explicite de compétitions
    # exclues (2e divisions confirmées + compétitions à données trop
    # souvent absentes), voir docstring et COMPETITIONS_EXCLUES.
    nb_avant_liste = len(fenetre)
    fenetre = [m for m in fenetre if not est_competition_exclue(m.get("competition"))]
    nb_exclus_liste = nb_avant_liste - len(fenetre)

    # AJOUT 03/09/2026 (3e partie) -- Chine : liste blanche, Super Ligue
    # uniquement (voir docstring).
    nb_avant_chine = len(fenetre)
    fenetre = [m for m in fenetre if not est_chine_non_autorisee(m.get("competition"))]
    nb_exclus_chine = nb_avant_chine - len(fenetre)

    # AJOUT 03/09/2026 (4e partie) -- Océanie : liste blanche par zone,
    # Australie/Nouvelle-Zélande uniquement (voir docstring).
    nb_avant_oceanie = len(fenetre)
    fenetre = [m for m in fenetre if not est_oceanie_non_autorisee(m.get("competition"))]
    nb_exclus_oceanie = nb_avant_oceanie - len(fenetre)

    # AJOUT 03/09/2026 (5e partie) -- Femmes : liste blanche, 1ère division
    # européenne uniquement (voir docstring).
    nb_avant_femmes = len(fenetre)
    fenetre = [m for m in fenetre if not est_femmes_non_autorisee(m.get("competition"))]
    nb_exclus_femmes = nb_avant_femmes - len(fenetre)

    # AJOUT 03/09/2026 (6e partie) -- Europe hommes : paliers par pays
    # (voir docstring et NIVEAUX_EUROPE_HOMMES).
    nb_avant_europe = len(fenetre)
    fenetre = [m for m in fenetre if not est_europe_hommes_non_autorisee(m.get("competition"))]
    nb_exclus_europe = nb_avant_europe - len(fenetre)

    # AJOUT 03/09/2026 (fusion) -- Amérique + reste de l'Europe + Afrique
    # + Asie : 1ère division uniquement, une seule liste blanche fusionnée
    # (voir docstring et TOP_FLIGHT_UNIQUE_PAR_PAYS).
    nb_avant_unique = len(fenetre)
    fenetre = [m for m in fenetre if not est_hors_top_flight_unique(m.get("competition"))]
    nb_exclus_top_flight_unique = nb_avant_unique - len(fenetre)

    return (fenetre, len(matchs_demain), len(matchs_j2_j3),
            nb_exclus_jeunes_reserves, nb_exclus_liste, nb_exclus_chine,
            nb_exclus_oceanie, nb_exclus_femmes, nb_exclus_europe,
            nb_exclus_top_flight_unique)


def _slim_pour_archive(s):
    """Version pour historique_pronostics.json -- encore plus réduite que
    la version site (pas besoin de LISTE_A/raison_non_traite pour un
    match déjà archivé, seulement de quoi calculer un ROI et vérifier)."""
    return {
        "domicile": s.get("domicile"),
        "exterieur": s.get("exterieur"),
        "competition": s.get("competition"),
        "match_id": s.get("match_id"),
        "date": s.get("date"),
        "heure": s.get("heure"),
        "score": None,
        "verdict_global": s.get("verdict_global"),
        "motif_no_go": s.get("motif_no_go"),
        "confiance": s.get("confiance"),
        "source_cotes": s.get("source_cotes"),
        "betpawa_url": s.get("betpawa_url"),
        "model_version": s.get("model_version"),
        "LISTE_B_liste_finale_apres_correlation": s.get("LISTE_B_liste_finale_apres_correlation"),
    }


def _leger_pour_site(s):
    """Version pour precalcul_leger.json -- tout ce que script.js affiche
    SAUF marches et lambda (les deux champs les plus lourds, utilisés
    seulement par la section 'tous les marchés calculés'/détail du lambda
    dans 'voir les détails')."""
    d = dict(s)
    d.pop("marches", None)
    d.pop("lambda", None)
    return d


def archive_precalcul(signaux, date_j1_iso):
    candidats = [
        s for s in signaux
        if s.get("traite") and s.get("verdict_global") and s.get("date") == date_j1_iso
    ]
    if not candidats:
        return 0

    historique = charge_json_ou_vide(FICHIER_HISTORIQUE, defaut=[])
    historique.append({
        "date": date_j1_iso,
        "source": "precalcul_auto",
        "nb_matchs_traites": len(candidats),
        "matchs": [_slim_pour_archive(s) for s in candidats],
    })
    with open(FICHIER_HISTORIQUE, "w", encoding="utf-8") as f:
        json.dump(historique, f, ensure_ascii=False, indent=2)

    return len(candidats)


def main():
    (fenetre, nb_demain, nb_j2_j3, nb_exclus_jeunes_reserves,
     nb_exclus_liste, nb_exclus_chine, nb_exclus_oceanie,
     nb_exclus_femmes, nb_exclus_europe,
     nb_exclus_top_flight_unique) = charge_matchs_fenetre()

    if not fenetre:
        print("ATTENTION : aucune matchs_demain.json/matchs_semaine.json "
              "exploitable -- vérifier que scraper.py et scraper_semaine.py "
              "ont bien tourné avant ce script.")

    print(f"Filtre jeunes/réserves : {nb_exclus_jeunes_reserves} match(s) "
          f"écarté(s) avant Betpawa et avant calcul des signaux.")
    print(f"Filtre liste explicite (2e divisions confirmées + données "
          f"souvent absentes) : {nb_exclus_liste} match(s) écarté(s).")
    print(f"Filtre Chine (liste blanche, Super Ligue uniquement) : "
          f"{nb_exclus_chine} match(s) écarté(s).")
    print(f"Filtre Océanie (liste blanche, Australie/Nouvelle-Zélande "
          f"uniquement) : {nb_exclus_oceanie} match(s) écarté(s).")
    print(f"Filtre Femmes (liste blanche, 1ère division européenne "
          f"uniquement) : {nb_exclus_femmes} match(s) écarté(s).")
    print(f"Filtre Europe hommes (paliers par pays) : "
          f"{nb_exclus_europe} match(s) écarté(s).")
    print(f"Filtre 1ère division unique (Amérique + reste Europe + "
          f"Afrique + Asie) : {nb_exclus_top_flight_unique} match(s) écarté(s).")

    compteurs_betpawa = resout_cotes_betpawa(fenetre)
    print(f"Résolution Betpawa : {compteurs_betpawa}")

    signaux = construit_signaux(fenetre)

    for s in signaux:
        s["model_version"] = MODEL_VERSION
        s["status"] = "READY" if s.get("traite") else "PARTIAL"
        s["prepared_at"] = datetime.datetime.now(datetime.timezone.utc).strftime(
            "%Y-%m-%dT%H:%M:%SZ"
        )

    date_j1_iso = date_j1()
    nb_archives = archive_precalcul(signaux, date_j1_iso)
    print(f"Archivage historique : {nb_archives} match(s) J+1 ({date_j1_iso}) "
          f"ajouté(s) à {FICHIER_HISTORIQUE}.")

    genere_le = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

    sortie = {
        "genere_le": genere_le,
        "nb_matchs_demain_source": nb_demain,
        "nb_matchs_j2_j3_source": nb_j2_j3,
        "nb_exclus_jeunes_reserves": nb_exclus_jeunes_reserves,
        "nb_exclus_liste_explicite": nb_exclus_liste,
        "nb_exclus_chine_liste_blanche": nb_exclus_chine,
        "nb_exclus_oceanie_liste_blanche": nb_exclus_oceanie,
        "nb_exclus_femmes_liste_blanche": nb_exclus_femmes,
        "nb_exclus_europe_hommes_paliers": nb_exclus_europe,
        "nb_exclus_top_flight_unique": nb_exclus_top_flight_unique,
        "nb_matchs_fenetre": len(fenetre),
        "nb_ready": sum(1 for s in signaux if s["status"] == "READY"),
        "nb_partial": sum(1 for s in signaux if s["status"] == "PARTIAL"),
        "nb_archives_historique": nb_archives,
        "betpawa": compteurs_betpawa,
        "signaux": signaux,
    }

    with open(FICHIER_SORTIE, "w", encoding="utf-8") as f:
        json.dump(sortie, f, ensure_ascii=False, indent=2)

    # AJOUT 02/09/2026 -- version allégée pour le site (voir docstring).
    sortie_legere = {
        "genere_le": genere_le,
        "nb_matchs_fenetre": len(fenetre),
        "nb_ready": sortie["nb_ready"],
        "nb_partial": sortie["nb_partial"],
        "signaux": [_leger_pour_site(s) for s in signaux],
    }
    with open(FICHIER_SORTIE_LEGER, "w", encoding="utf-8") as f:
        json.dump(sortie_legere, f, ensure_ascii=False, indent=2)

    print(f"{FICHIER_SORTIE} écrit : {sortie['nb_matchs_fenetre']} matchs "
          f"({sortie['nb_ready']} READY, {sortie['nb_partial']} PARTIAL). "
          f"{FICHIER_SORTIE_LEGER} écrit en parallèle (sans marches/lambda). "
          f"Betpawa : {compteurs_betpawa['betpawa_cotes_extraites']} match(s) "
          f"avec cotes réelles, {compteurs_betpawa['betpawa_tentes']} tenté(s).")

    if not fenetre:
        sys.exit(1)


if __name__ == "__main__":
    main()
