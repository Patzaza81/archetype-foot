# CORRECTIF 03/09/2026 -- la version par sous-chaîne "dans" donnait deux
# faux gardés : "Ligue Nationale" matchait à l'intérieur de "Ligue
# Nationale N/S Nord" (palier 6 anglais, à exclure), et "Serie A"
# matchait à l'intérieur de "Coupe Féminine de Serie A" (une coupe
# féminine, pas le championnat). La comparaison "exacte" essayée ensuite
# cassait à son tour les groupes légitimes ("Série C Girone A", "Ligue 3
# Groupe A" doivent rester des paliers autorisés). Solution retenue :
# "commence par" (gère les suffixes Groupe/Girone légitimes) + exclusion
# de tout ce qui contient "coupe" (une coupe n'est jamais un palier de
# championnat, quel que soit le pays) + garde explicite pour le seul cas
# où un préfixe autorisé est aussi le début d'un palier inférieur non
# désiré (Angleterre "Ligue Nationale" vs "Ligue Nationale N/S Nord").
def est_europe_hommes_non_autorisee(nom_competition):
    c = (nom_competition or "").replace("\n", " ")
    # CORRECTIF 03/09/2026 -- vérifie l'appartenance à la liste blanche
    # Femmes ENTIÈRE, pas seulement la présence d'un mot-clé "femme"/
    # "femin" : les noms de marque purs (Damallsvenskan, Toppserien,
    # Nationalliga A) n'ont aucun marqueur détectable et se faisaient
    # exclure par erreur ici (aucun palier masculin ne les matche).
    if any(pays in c and comp in c for pays, comp in COMPETITIONS_FEMMES_AUTORISEES):
        return False
    if any(m in c.lower() for m in ("femme", "femin", "fémin")):
        return False  # géré par est_femmes_non_autorisee -- pas de double traitement ici
    if ":" not in c:
        return False
    pays_brut, comp_brut = c.split(":", 1)
    pays_brut = pays_brut.strip()
    comp = " ".join(comp_brut.split())
    if pays_brut not in NIVEAUX_EUROPE_HOMMES:
        return False
    # CORRECTIF 03/09/2026 -- une coupe n'est pas un palier de championnat,
    # quel que soit le pays de cette liste : exclue directement (l'essai
    # précédent la laissait passer par erreur).
    if "coupe" in comp.lower():
        return True
    for palier in NIVEAUX_EUROPE_HOMMES[pays_brut]["paliers"]:
        for motif in palier:
            if not comp.startswith(motif):
                continue
            if pays_brut == "Angleterre" and motif == "Ligue Nationale" and \
               ("Nord" in comp or "Sud" in comp):
                continue  # National League North/South (palier 6), pas le vrai palier 5
            return False
    return True


# AJOUT 03/09/2026 (7e partie) -- reste de l'Europe (33 pays hors des 17
# déjà traités) : seule la 1ère division, règle par défaut. Comparaison
# EXACTE (pas "commence par") -- contrairement aux paliers à groupes
# (Serie C Girone, National 3 Groupe...), ces championnats sont des
# ligues nationales uniques sans subdivision régionale, donc pas de
# risque de casser un "Groupe A" légitime, et ça évite la collision
# "Super Ligue" / "Super Ligue 2" (Grèce, Serbie) rencontrée plus haut.
#
# Nouveaux pièges de traduction trouvés en vérifiant CE bloc contre les
# vraies données du 03/09 (le mot "premier/première/1er/1ère" désigne le
# 2e échelon, pas le 1er, dans ces 7 cas) :
#   - Biélorussie : "1ère Division" = 2e échelon (Bélarus First League) ;
#     le vrai 1er est "Première Ligue" (Premier League).
#   - Croatie : "Prva NL" = 2e échelon malgré "Prva" ("premier" en
#     croate) ; le vrai 1er est "HNL".
#   - Danemark : "1ère Division" = 2e échelon (Danish 1st Division) ; le
#     vrai 1er est "Superligaen".
#   - Irlande : "Division 1" = 2e échelon (League of Ireland First
#     Division) ; le vrai 1er est "Première Ligue" (Premier Division).
#   - Islande : "1 Deild Karla" = 2e échelon malgré le "1" ; le vrai 1er
#     est "Úrvalsdeild".
#   - Lituanie : "1 Lyga" = 2e échelon ; le vrai 1er est "A Lyga".
#   - Monténégro : "Prva Liga" = 2e échelon malgré "Prva" ; ATTENTION,
#     piège inverse du Monténégro par rapport à la Serbie -- au
#     Monténégro "Prva Liga" est le VRAI 1er échelon (rien en dessous
#     dans cette fenêtre ne le contredit), alors qu'en Serbie "Prva
#     Liga" est le 2e (voir Serbie ci-dessous). Le même libellé ne veut
#     pas dire la même chose d'un pays à l'autre -- aucune règle
#     générique n'aurait pu deviner ça.
#   - Russie : "FNL" = 2e échelon (Football National League, sigle
#     officiel) ; le vrai 1er est "Première Ligue" (Premier Liga).
#   - Serbie : "Prva Liga" = 2e échelon (malgré "Prva" = "premier") ; le
#     vrai 1er est "Super Ligue".
# AJOUT 03/09/2026 (fusion) -- Amérique, reste de l'Europe, Afrique et
# Asie regroupés dans UNE seule liste blanche "1ère division uniquement",
# une seule fonction -- au lieu de 3-4 blocs séparés qui faisaient tous
# la même chose. Reste SÉPARÉ : NIVEAUX_EUROPE_HOMMES (17 pays à paliers
# multiples, structure différente par nature -- ne peut pas être fondu
# dans une liste à une seule valeur par pays).
