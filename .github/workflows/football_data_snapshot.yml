name: Archive annuel Football-Data

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Saison Football-Data terminée à archiver, ex. 2526"
        required: true
        type: string
  # AJOUT 24/09/2026 : déclenchement depuis l'iPhone sans bouton Actions -- modifier
  # data/football_data/demande_snapshot.txt (une ligne : la saison, ex. 2526) lance l'archive de cette saison.
  push:
    paths:
      - "data/football_data/demande_snapshot.txt"
  schedule:
    # Vérification annuelle en juillet: la saison précédente est alors terminée.
    - cron: "30 4 5 7 *"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer requests
        run: pip install requests

      - name: Déterminer la saison terminée
        id: season
        env:
          INPUT_SEASON: ${{ github.event.inputs.season }}
        run: |
          DEMANDE=""
          if [ "${{ github.event_name }}" = "push" ] && [ -f data/football_data/demande_snapshot.txt ]; then
            DEMANDE=$(grep -Eo '^[0-9]{4}$' data/football_data/demande_snapshot.txt | head -1)
          fi
          if [ -n "$INPUT_SEASON" ]; then
            echo "value=$INPUT_SEASON" >> "$GITHUB_OUTPUT"
          elif [ -n "$DEMANDE" ]; then
            echo "value=$DEMANDE" >> "$GITHUB_OUTPUT"
          else
            YEAR=$(( $(date -u +%Y) - 1 ))
            echo "value=$(printf '%02d%02d' $((YEAR % 100)) $(((YEAR + 1) % 100)))" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire le snapshot historique complet
        run: python archive_football_data.py --season "${{ steps.season.outputs.value }}"

      - name: Vérifier le verrou d'immutabilité
        run: |
          test -f "data/football_data/snapshots/${{ steps.season.outputs.value }}/_SNAPSHOT_COMPLETE.json"
          test -f "data/football_data/snapshots/${{ steps.season.outputs.value }}/nouvelles_ligues/_SNAPSHOT_COMPLETE.json"

      - name: Publier le snapshot
        run: |
          git config user.name "archetype-foot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "data/football_data/snapshots/${{ steps.season.outputs.value }}/"
          git diff --staged --quiet || git commit -m "Archive Football-Data saison ${{ steps.season.outputs.value }}"
          git pull --rebase origin main
          git push
