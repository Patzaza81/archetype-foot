name: Diagnostic sources de données

# AJOUT 24/09/2026 -- teste des sources externes (football-data.co.uk, foot-direct, BeSoccer, Forebet) depuis
# l'environnement du pipeline. Se lance quand diagnostic/sources_a_tester.txt change, ou à la main.
# Lecture seule : n'écrit que dans diagnostic/.

on:
  push:
    paths:
      - "diagnostic/sources_a_tester.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-archetype-foot
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python diagnostic_sources.py
      - name: Publier
        run: |
          git config user.name "archetype-foot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add diagnostic/
          git diff --staged --quiet || git commit -m "Diagnostic : test des sources de données"
          git pull --rebase origin main
          git push
