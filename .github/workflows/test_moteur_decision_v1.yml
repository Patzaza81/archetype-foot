name: Test moteur decision V1
on:
  push:
    branches: ["moteur-decision-v1"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q tests/test_moteur_decision_core.py
