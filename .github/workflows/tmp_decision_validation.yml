name: Temporary decision core validation

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/test_moteur_decision_core.py tests/test_moteur_decision_risk.py tests/test_moteur_decision_justification.py -q
