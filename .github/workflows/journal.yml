name: Journal de rentabilité

# AJOUT 24/09/2026 -- Workflow SÉPARÉ du pipeline quotidien, volontairement :
# le journal (journal_rentabilite.py -> journal.json, lu par journal.html) doit rester
# à jour même si le pipeline principal s'arrête (ex. échec de l'étape d'autotests). Il ne fait que LIRE les
# fichiers déjà publiés (historique_pronostics.json, archive/, archive_shrink/, precalcul_*.json,
# data/echantillon_betpawa_501.json) et n'écrit que journal.json et controle_saisons.json.
#
# Déclenchements :
#   - juste après chaque fin du pipeline quotidien (réussi ou non) : données les plus fraîches ;
#   - filet de sécurité à 05:30 UTC (06:30 à Douala) si le pipeline n'a pas tourné ;
#   - à la main (onglet Actions > Journal de rentabilité > Run workflow).

on:
  workflow_run:
    workflows: ["Pipeline quotidien Archetype Foot"]
    types: [completed]
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Même groupe que le pipeline : jamais deux commits simultanés sur main.
concurrency:
  group: pipeline-archetype-foot
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pytest
        run: pip install pytest

      # Filet de sécurité : si le règlement des marchés ou les statuts sont cassés, on ne publie rien.
      - name: Tests du journal et du contrôle des saisons
        run: python -m pytest tests/test_journal_rentabilite.py tests/test_controle_saisons.py tests/test_assemblage_equipes.py -q

      - name: Construire journal.json
        run: python journal_rentabilite.py

      # AJOUT 24/09/2026 -- contrôle croisé des saisons d'équipes (lecture seule, écrit controle_saisons.json,
      # affiché sur la page Système). Un échec ne bloque pas la publication du journal.
      - name: Contrôler les données de saison (controle_saisons.json)
        run: python controle_saisons.py
        continue-on-error: true

      # AJOUT 24/09/2026 -- A3 + A4 bis : correspondance des noms Football-Data <-> Matchendirect et assemblage par
      # équipe (Football-Data en base, jours manquants par Matchendirect, provisoires remplacés dès publication).
      # Reconstruit entièrement à chaque run, jamais cumulé.
      - name: Relier les équipes et assembler les données (data/correspondances, data/assemblage)
        run: python assemblage_equipes.py
        continue-on-error: true

      - name: Publier journal.json et controle_saisons.json
        run: |
          git config user.name "archetype-foot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add journal.json
          [ -f controle_saisons.json ] && git add controle_saisons.json
          [ -d data/correspondances ] && git add data/correspondances
          [ -d data/assemblage ] && git add data/assemblage
          git diff --staged --quiet || git commit -m "Journal de rentabilité"
          git pull --rebase origin main
          git push
