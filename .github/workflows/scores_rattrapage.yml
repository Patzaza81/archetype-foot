name: Rattrapage des scores de l'historique

# AJOUT 26/09/2026 -- comble les jours sans score dans historique_pronostics.json (aucun score écrit du 18/09 au
# 26/09) puis reconstruit le journal pour qu'il en tienne compte tout de suite. Se lance quand
# data/demande_rattrapage_scores.txt change, ou à la main. Même groupe que le pipeline : jamais deux écritures à la fois.

on:
  push:
    paths:
      - "data/demande_rattrapage_scores.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-archetype-foot
  cancel-in-progress: false

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest tests/test_enregistre_scores_historique.py tests/test_journal_rentabilite.py -q
      - name: Combler tous les jours sans score
        run: python enregistre_scores_historique.py
      - name: Reconstruire le journal et les contrôles
        run: |
          python journal_rentabilite.py
          python controle_saisons.py || true
      - name: Publier
        run: |
          git config user.name "archetype-foot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add historique_pronostics.json journal.json controle_saisons.json
          git diff --staged --quiet || git commit -m "Rattrapage des scores de l'historique + journal reconstruit"
          git pull --rebase origin main
          git push
