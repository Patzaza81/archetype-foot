name: Apply Archetype prototype CSS
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[prototype-css]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject stylesheet and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('archetype.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="archetype-prototype.css">'
          if link not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('archetype.html: </head> introuvable')
              s = s.replace(marker, '  ' + link + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          Path('.github/workflows/apply-prototype-css.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archetype.html archetype-prototype.css .github/workflows/apply-prototype-css.yml
          git commit -m 'fix(ui): apply prototype card calibration [prototype-css]'
          git push
