name: BetPawa public browser smoke tests

on:
  pull_request:
    paths:
      - "tests/test_betpawa_browser_smoke.py"
      - ".github/workflows/betpawa-browser-smoke.yml"
      - "resolution_betpawa.py"
      - "betpawa_validation.py"
      - "tools/**"
      - "tests/test_betpawa_local_runner.py"
      - "tests/test_betpawa_loop.py"
      - "tools/run_betpawa_loop.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  betpawa-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Run local-runner unit tests and BetPawa browser smoke tests
        run: python -m pytest -q -ra tests/test_betpawa_local_runner.py tests/test_betpawa_loop.py tests/test_betpawa_browser_smoke.py
