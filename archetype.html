<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071E18">
<title>Archetype Foot — Sélections</title>
<link rel="stylesheet" href="style.css">
<style>

/* ============================================================
   ARCHETYPE — présentation publique
   CSS strictement limité à .page-archetype
   ============================================================ */

.page-archetype {
  --arch-bg: #071e18;
  --arch-panel: #0d2a22;
  --arch-panel-2: #12362c;
  --arch-line: rgba(255,255,255,.10);
  --arch-text: #f4f1e8;
  --arch-muted: #b9c6c1;
  --arch-accent: #e4c34f;
  --arch-accent-soft: rgba(228,195,79,.14);
  --arch-good: #7ed7a4;
  --arch-width: 820px;

  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% -10%, rgba(228,195,79,.10), transparent 35%),
    var(--arch-bg);
  color: var(--arch-text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.45;
}

.page-archetype *,
.page-archetype *::before,
.page-archetype *::after {
  box-sizing: border-box;
}

.page-archetype .header-archetype {
  width: min(var(--arch-width), calc(100% - 28px));
  margin: 0 auto;
  padding: 34px 0 22px;
}

.page-archetype .marque-archetype {
  display: flex;
  align-items: center;
  gap: 16px;
}

.page-archetype .logo-archetype {
  width: 48px;
  height: 48px;
  border: 1px solid rgba(228,195,79,.55);
  border-radius: 14px;
  display: grid;
  place-items: center;
  color: var(--arch-accent);
  font-family: Georgia, serif;
  font-size: 28px;
  font-weight: 700;
  background: rgba(228,195,79,.07);
}

.page-archetype .marque-archetype h1 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(30px, 7vw, 52px);
  letter-spacing: .04em;
}

.page-archetype .marque-archetype p {
  margin: 3px 0 0;
  color: var(--arch-muted);
  font-size: 14px;
}

.page-archetype .nav-bouton {
  display: inline-flex;
  margin-top: 24px;
  padding: 9px 14px;
  border: 1px solid var(--arch-line);
  border-radius: 999px;
  color: var(--arch-text);
  text-decoration: none;
  background: rgba(255,255,255,.035);
}

.page-archetype .nav-bouton:hover {
  border-color: rgba(228,195,79,.45);
  color: var(--arch-accent);
}

.page-archetype .maj-archetype {
  margin-top: 16px;
  color: var(--arch-muted);
  font-size: 14px;
}

.page-archetype .point-live {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 7px;
  border-radius: 50%;
  background: var(--arch-good);
  box-shadow: 0 0 0 4px rgba(126,215,164,.10);
}

.page-archetype .flux-selections {
  width: min(var(--arch-width), calc(100% - 28px));
  margin: 0 auto;
  padding: 0 0 60px;
}

.page-archetype .carte-match {
  overflow: hidden;
  margin: 0 0 28px;
  border: 1px solid var(--arch-line);
  border-radius: 24px;
  background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.018));
  box-shadow: 0 18px 45px rgba(0,0,0,.22);
}

.page-archetype .entete-match {
  padding: 24px 20px 18px;
  border-bottom: 1px solid var(--arch-line);
}

.page-archetype .match-equipes {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: center;
}

.page-archetype .bloc-equipe {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.page-archetype .bloc-equipe.exterieur {
  justify-content: flex-end;
  text-align: right;
}

.page-archetype .ecusson-equipe {
  flex: 0 0 42px;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid rgba(228,195,79,.45);
  color: var(--arch-accent);
  background: var(--arch-accent-soft);
  font-weight: 800;
  font-size: 13px;
}

.page-archetype .nom-equipe {
  min-width: 0;
  color: var(--arch-text);
  font-weight: 700;
  font-size: 16px;
}

.page-archetype .bloc-horaire {
  min-width: 94px;
  text-align: center;
}

.page-archetype .bloc-horaire strong {
  display: block;
  color: var(--arch-accent);
  font-size: 18px;
}

.page-archetype .bloc-horaire span {
  display: block;
  margin-top: 3px;
  color: var(--arch-muted);
  font-size: 12px;
}

.page-archetype .info-competition {
  margin-top: 15px;
  color: var(--arch-muted);
  font-size: 13px;
}

.page-archetype .point-pays {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 6px;
  vertical-align: middle;
  border-radius: 50%;
  background: var(--arch-accent);
}

.page-archetype .carte-pronostic {
  margin: 18px;
  padding: 20px;
  border: 1px solid var(--arch-line);
  border-radius: 19px;
  background: rgba(0,0,0,.13);
}

.page-archetype .rang-1 {
  border-color: rgba(228,195,79,.42);
  background: linear-gradient(145deg, rgba(228,195,79,.09), rgba(255,255,255,.025));
}

.page-archetype .entete-rang {
  display: flex;
  align-items: center;
  gap: 11px;
}

.page-archetype .icone-rang {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--arch-accent-soft);
  color: var(--arch-accent);
  font-size: 18px;
}

.page-archetype .pastille-rang {
  color: var(--arch-accent);
  font-size: 13px;
  font-weight: 800;
}

.page-archetype .sous-titre-rang {
  color: var(--arch-muted);
  font-size: 12px;
}

.page-archetype .libelle-marche {
  margin: 22px 0 17px;
  color: var(--arch-text);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(25px, 6vw, 36px);
  line-height: 1.12;
}

.page-archetype .bloc-principal-resultat {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 18px;
  align-items: center;
}

.page-archetype .bloc-cote {
  min-width: 86px;
  padding-right: 18px;
  border-right: 1px solid var(--arch-line);
}

.page-archetype .etiquette {
  display: block;
  color: var(--arch-muted);
  font-size: 12px;
}

.page-archetype .valeur-cote {
  display: block;
  margin-top: 2px;
  color: var(--arch-text);
  font-size: 28px;
}

.page-archetype .jauge-probabilite {
  position: relative;
  width: 82px;
  height: 82px;
  justify-self: end;
}

.page-archetype .jauge-probabilite svg {
  width: 82px;
  height: 82px;
  transform: rotate(-90deg);
}

.page-archetype .jauge-probabilite circle {
  fill: none;
  stroke-width: 6;
}

.page-archetype .fond-anneau {
  stroke: rgba(255,255,255,.10);
}

.page-archetype .valeur-anneau {
  stroke: var(--arch-accent);
  stroke-linecap: round;
}

.page-archetype .jauge-probabilite strong {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--arch-text);
  font-size: 18px;
}

.page-archetype .bloc-proba-texte {
  display: none;
}

.page-archetype .ligne-confiance {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  color: var(--arch-muted);
  font-size: 13px;
}

.page-archetype .etoiles {
  letter-spacing: 1px;
  color: var(--arch-accent);
  font-size: 17px;
}

.page-archetype .etoiles .vide {
  color: rgba(255,255,255,.16);
}

.page-archetype .bloc-pourquoi {
  margin-top: 20px;
  padding: 16px;
  border-left: 3px solid var(--arch-accent);
  border-radius: 0 12px 12px 0;
  background: rgba(228,195,79,.055);
}

.page-archetype .bloc-pourquoi .titre {
  color: var(--arch-text);
  font-weight: 800;
  font-size: 14px;
}

.page-archetype .bloc-pourquoi .texte {
  margin: 8px 0 0;
  color: var(--arch-muted);
  font-size: 14px;
  line-height: 1.6;
}

.page-archetype .metriques-secondaires {
  display: flex;
  gap: 28px;
  margin-top: 17px;
}

.page-archetype .metrique .valeur {
  color: var(--arch-text);
  font-size: 16px;
}

.page-archetype .carte-pronostic.vide {
  opacity: .68;
}

.page-archetype .absence-selection {
  margin: 18px 0 0;
  color: var(--arch-muted);
  font-size: 14px;
}

.page-archetype .details-analyse {
  margin: 18px;
  border-top: 1px solid var(--arch-line);
}

.page-archetype .details-analyse summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 18px 2px 4px;
  cursor: pointer;
  list-style: none;
}

.page-archetype .details-analyse summary::-webkit-details-marker {
  display: none;
}

.page-archetype .details-analyse summary strong {
  display: block;
  color: var(--arch-text);
}

.page-archetype .details-analyse summary small {
  display: block;
  margin-top: 3px;
  color: var(--arch-muted);
}

.page-archetype .chevron {
  color: var(--arch-accent);
  font-size: 22px;
}

.page-archetype .contenu-details {
  padding: 12px 0 18px;
}

.page-archetype .ligne-detail {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 9px 0;
  border-bottom: 1px solid rgba(255,255,255,.06);
  font-size: 12px;
}

.page-archetype .ligne-detail .cle {
  color: var(--arch-muted);
}

.page-archetype .ligne-detail .val {
  color: var(--arch-text);
  text-align: right;
  overflow-wrap: anywhere;
}

.page-archetype .etat-vide {
  padding: 30px 22px;
  border: 1px solid var(--arch-line);
  border-radius: 20px;
  background: rgba(255,255,255,.025);
}

.page-archetype .etat-vide strong {
  color: var(--arch-text);
}

.page-archetype .etat-vide p {
  margin-bottom: 0;
  color: var(--arch-muted);
}

@media (max-width: 560px) {
  .page-archetype .header-archetype {
    padding-top: 22px;
  }

  .page-archetype .marque-archetype p {
    max-width: 230px;
  }

  .page-archetype .entete-match,
  .page-archetype .carte-pronostic {
    padding-left: 16px;
    padding-right: 16px;
  }

  .page-archetype .match-equipes {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .page-archetype .bloc-equipe,
  .page-archetype .bloc-equipe.exterieur {
    justify-content: flex-start;
    text-align: left;
  }

  .page-archetype .bloc-horaire {
    order: -1;
    text-align: left;
  }

  .page-archetype .bloc-horaire strong,
  .page-archetype .bloc-horaire span {
    display: inline;
    margin-right: 8px;
  }

  .page-archetype .bloc-principal-resultat {
    grid-template-columns: 1fr auto;
  }

  .page-archetype .bloc-cote {
    border-right: 0;
    padding-right: 0;
  }

  .page-archetype .jauge-probabilite {
    justify-self: end;
  }

  .page-archetype .ligne-detail {
    flex-direction: column;
    gap: 3px;
  }

  .page-archetype .ligne-detail .val {
    text-align: left;
  }
}

</style>
</head>
<body class="page-archetype">
<header class="header-archetype">
  <div class="marque-archetype">
    <div class="logo-archetype" aria-hidden="true">A</div>
    <div>
      <h1>ARCHETYPE</h1>
      <p>Des analyses puissantes pour de meilleures décisions</p>
    </div>
  </div>
  <a href="index.html" class="nav-bouton">← Accueil</a>
  <div id="maj" class="maj-archetype">Chargement…</div>
</header>
<main id="matches" class="flux-selections"></main>
<script src="traduction_marches.js"></script>
<script src="archetype.js"></script>
</body>
</html>
