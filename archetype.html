<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061A14">
<title>ARCHETYPE — Sélections</title>
<style>
/* CSS EXCLUSIVEMENT LOCAL À CETTE PAGE : aucune règle globale du site n'est modifiée. */
:root{--bg:#061a14;--panel:#0b241b;--panel2:#102d22;--text:#f4f0e6;--muted:#aab9b2;--line:rgba(255,255,255,.10);--yellow:#f4c53d;--cyan:#17c7ef;--purple:#c77dff}
*{box-sizing:border-box}html{background:#061a14}body{margin:0;background:radial-gradient(circle at 50% -10%,#183b2c 0,#061a14 42%,#04120e 100%);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.4}.page{width:min(100%,980px);margin:0 auto}.topbar{padding:22px 18px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(6,26,20,.94);backdrop-filter:blur(12px);z-index:10}.brand{display:flex;align-items:center;justify-content:space-between;gap:14px}.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--yellow);color:#0b2119;display:grid;place-items:center;font-weight:950;font-size:25px}.brand-name{font-weight:950;letter-spacing:.08em;font-size:20px}.brand-sub{color:var(--muted);font-size:11px;margin-top:2px}.brand-left{display:flex;align-items:center;gap:11px}.back{color:var(--muted);text-decoration:none;font-size:13px;white-space:nowrap}.status{margin-top:13px;color:var(--muted);font-size:12px}.status strong{color:var(--text)}.flux{padding:14px 12px 50px}.match{border:1px solid rgba(255,255,255,.10);border-radius:26px;background:rgba(9,32,24,.84);overflow:hidden;margin:0 0 18px;box-shadow:0 18px 45px rgba(0,0,0,.18)}.match-head{padding:20px 18px 17px;border-bottom:1px solid var(--line)}.match-line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.team{display:flex;align-items:center;gap:10px;font-weight:850;font-size:18px}.team.away{justify-content:flex-end;text-align:right}.crest{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;background:#26382d;border:1px solid rgba(244,197,61,.65);color:var(--yellow);font-weight:900;font-size:12px}.kick{min-width:120px;text-align:center;padding:8px 12px;border:1px solid rgba(23,199,239,.32);border-radius:14px;background:#071c17}.kick strong{display:block;font-size:18px}.kick span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.competition{margin-top:13px;color:var(--muted);font-size:12px;font-weight:700}.competition::first-letter{color:var(--yellow)}.choices{padding:16px}.selection{border-radius:24px;padding:22px;margin:0 0 14px;background:linear-gradient(145deg,rgba(12,38,28,.98),rgba(7,25,19,.98));border:1px solid var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}.selection:last-child{margin-bottom:0}.selection.p1{--accent:var(--yellow);--soft:rgba(244,197,61,.10);--soft2:rgba(244,197,61,.04)}.selection.p2{--accent:var(--cyan);--soft:rgba(23,199,239,.10);--soft2:rgba(23,199,239,.04)}.selection.p3{--accent:var(--purple);--soft:rgba(199,125,255,.10);--soft2:rgba(199,125,255,.04)}.choice-head{display:flex;align-items:center;gap:12px}.choice-icon{width:56px;height:56px;flex:0 0 56px;border-radius:17px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:23px;font-weight:950}.choice-kicker{color:var(--accent);font-size:14px;font-weight:950;letter-spacing:.04em;text-transform:uppercase}.choice-sub{color:var(--muted);font-size:12px;font-weight:750;margin-top:2px}.market{font-family:Georgia,"Times New Roman",serif;font-size:clamp(27px,5vw,42px);line-height:1.05;margin:24px 0 18px;color:var(--text);letter-spacing:-.025em}.intro{font-size:14px;color:#d7dfda;margin:-8px 0 20px;max-width:760px}.metrics{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:20px;align-items:center}.label{display:block;color:var(--muted);font-size:12px;font-weight:750;margin-bottom:2px}.odds{font-size:34px;font-weight:950;letter-spacing:-.03em}.success-label{margin-top:15px}.success{font-size:24px;font-weight:900}.gauge{width:128px;height:128px;position:relative;justify-self:end}.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}.gauge circle{fill:none;stroke-width:7}.gauge .track{stroke:rgba(255,255,255,.10)}.gauge .value{stroke:var(--accent);stroke-linecap:round}.gauge strong{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}.confidence{display:flex;align-items:center;gap:16px;margin:20px 0}.stars{color:var(--yellow);font-size:22px;letter-spacing:1px}.confidence span:last-child{color:var(--muted);font-size:13px}.confidence strong{color:var(--text)}.why{background:var(--soft2);border-left:5px solid var(--accent);border-radius:0 20px 20px 0;padding:18px 18px 16px}.why-title{font-size:15px;font-weight:950;margin-bottom:12px}.why-selection{color:#dbe4df;font-size:13px;margin:0 0 13px}.proof{padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}.proof:first-of-type{border-top:0;padding-top:0}.proof-title{display:block;color:var(--accent);font-size:12px;font-weight:900;margin-bottom:3px}.proof-text{display:block;color:#c5d1cb;font-size:13px;line-height:1.55}.financial{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:19px}.financial .label{font-size:11px}.financial strong{font-size:18px}.details{border-top:1px solid var(--line);margin-top:16px}.details summary{cursor:pointer;list-style:none;padding:17px 4px;display:flex;justify-content:space-between;align-items:center}.details summary::-webkit-details-marker{display:none}.details-title{font-weight:900;font-size:14px}.details-sub{display:block;color:var(--muted);font-size:11px;margin-top:2px}.details-arrow{color:var(--accent);font-size:18px}.details-body{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;padding:0 4px 17px}.detail{padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}.detail-label{display:block;color:var(--muted);font-size:10px}.detail-value{display:block;color:var(--text);font-size:12px;font-weight:800;margin-top:2px;overflow-wrap:anywhere}.empty{padding:28px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.empty strong{color:var(--text)}
@media(max-width:650px){.topbar{padding:17px 14px 13px}.flux{padding:10px 8px 40px}.match{border-radius:20px}.match-head{padding:16px 13px}.team{font-size:14px}.crest{width:38px;height:38px;flex-basis:38px}.kick{min-width:92px;padding:7px 8px}.kick strong{font-size:15px}.selection{padding:17px;border-radius:20px}.choice-icon{width:48px;height:48px;flex-basis:48px}.market{font-size:29px;margin-top:20px}.metrics{grid-template-columns:1fr 112px;gap:10px}.gauge{width:104px;height:104px}.gauge strong{font-size:18px}.details-body{grid-template-columns:1fr}.financial{gap:10px}}
</style>
</head>
<body>
<div class="page">
<header class="topbar">
  <div class="brand">
    <div class="brand-left"><div class="brand-mark">A</div><div><div class="brand-name">ARCHETYPE</div><div class="brand-sub">Des analyses puissantes pour de meilleures décisions</div></div></div>
    <a class="back" href="index.html">← Accueil</a>
  </div>
  <div id="maj" class="status">Chargement…</div>
</header>
<main id="matches" class="flux" aria-live="polite"></main>
</div>
<script src="archetype.js"></script>
</body>
</html>
