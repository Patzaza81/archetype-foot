<style>
.page-archetype{--a-bg:var(--af-cream);--a-card:#FDFBF7;--a-card-soft:#F7F3EA;--a-text:#172A4D;--a-muted:#687083;--a-line:rgba(23,42,77,.13);--p1:var(--af-gold);--p2:var(--af-blue);--p3:var(--af-blue-violet);min-height:100vh;background:var(--a-bg);color:var(--a-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px 10px 34px}
.page-archetype *{box-sizing:border-box}.page-archetype .header-archetype{position:relative;max-width:860px;margin:0 auto 12px;padding:0 3px 9px!important;background:transparent!important;border-bottom:1px solid rgba(23,42,77,.16)!important}.page-archetype .marque-archetype{display:flex;align-items:center;gap:10px}.page-archetype .logo-archetype{width:36px;height:36px;border:0;border-radius:0;background:transparent;color:var(--af-gold);font-size:29px;font-weight:950;display:grid;place-items:center;line-height:1}.page-archetype h1{margin:0;font-size:25px!important;letter-spacing:.02em;color:var(--af-blue)!important;font-weight:900!important;line-height:1!important}.page-archetype .marque-archetype p{margin:3px 0 0;color:#35547D;font-size:10px;font-weight:600}.page-archetype .nav-bouton{display:none}.page-archetype .maj-archetype{margin-top:5px!important;color:var(--af-blue)!important;font-size:10px!important;font-weight:800}.page-archetype .flux-selections{max-width:860px;margin:0 auto;padding:0!important}.page-archetype .carte-match{margin:0 auto 14px;border:1px solid rgba(154,112,27,.22);border-radius:18px;overflow:hidden;background:var(--a-card);box-shadow:0 12px 30px rgba(53,42,24,.13)}
.page-archetype .entete-match{position:relative;padding:16px 14px 12px;border-bottom:1px solid var(--a-line)!important}.page-archetype .ligne-match{display:grid;grid-template-columns:minmax(0,1fr) 105px minmax(0,1fr);align-items:center;gap:9px}.page-archetype .equipe{display:flex;align-items:center;gap:8px;min-width:0;color:var(--a-text);font-size:18px;font-weight:900;line-height:1.05}.page-archetype .equipe.exterieur{justify-content:flex-end;text-align:right}.page-archetype .equipe span:last-child{overflow-wrap:anywhere}.page-archetype .ecusson-equipe{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(23,42,77,.18);background:#fff;color:var(--af-blue);font-size:12px;font-weight:950;box-shadow:0 3px 8px rgba(23,42,77,.08)}.page-archetype .bloc-horaire{text-align:center;border:1px solid rgba(154,112,27,.20);border-radius:16px;padding:8px 5px;background:rgba(255,255,255,.45)}.page-archetype .bloc-horaire strong{display:block;color:var(--a-text);font-size:22px;line-height:1.05}.page-archetype .bloc-horaire span{display:block;margin-top:4px;color:var(--a-text);font-size:10px;font-weight:700;line-height:1.1}.page-archetype .competition{margin:10px auto 0;width:max-content;max-width:100%;text-align:center;background:#101114;color:#fff;border-radius:999px;padding:5px 12px;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.page-archetype .bouton-repli{position:absolute;right:12px;bottom:-13px;border:1px solid rgba(49,92,255,.20);border-radius:999px;background:var(--a-card);color:var(--af-blue);padding:4px 9px;font-size:9px;font-weight:800;cursor:pointer;z-index:2}.page-archetype .carte-repliee .contenu-carte,.page-archetype .carte-repliee .details-analyse{display:none}.page-archetype .carte-repliee .entete-match{border-bottom:0!important}
.page-archetype .selection-tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--a-line)}.page-archetype .selection-tab{position:relative;border:0;border-radius:0;padding:11px 6px 10px;color:#fff;font:900 11px/1.08 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;cursor:pointer;text-transform:uppercase}.page-archetype .selection-tab small{display:block;margin-top:3px;font-size:9px;font-weight:700;text-transform:none;opacity:.92}.page-archetype .selection-tab:nth-child(1){background:var(--p1)}.page-archetype .selection-tab:nth-child(2){background:var(--p2)}.page-archetype .selection-tab:nth-child(3){background:var(--p3)}.page-archetype .selection-tab.actif:after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}.page-archetype .selection-tab.actif{z-index:1}
.page-archetype .contenu-carte{padding:16px 16px 7px}.page-archetype .selection{display:none;border:0;background:transparent;overflow:visible}.page-archetype .selection.actif{display:block}.page-archetype .selection-inner{padding:0}.page-archetype .selection-head{display:none}.page-archetype .libelle-marche{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--a-text);font-size:25px;line-height:1.12;font-weight:900;margin:0 0 8px}.page-archetype .resume-marche{margin:0 0 11px;color:#273C5B;font-size:12px;line-height:1.38;font-weight:600;max-width:680px}.page-archetype .donnees-principales{display:grid;grid-template-columns:minmax(0,1fr) 82px;align-items:center;gap:10px;border-top:1px solid var(--a-line);border-bottom:1px solid var(--a-line);padding:10px 0}.page-archetype .etiquette{display:block;color:var(--a-muted);font-size:9px;font-weight:700}.page-archetype .cote{display:block;font-size:27px;line-height:1;margin:3px 0 9px;color:var(--af-blue);font-weight:950}.page-archetype .probabilite-ligne{display:flex;align-items:baseline;gap:5px}.page-archetype .probabilite-ligne strong{font-size:16px;color:var(--a-text)}.page-archetype .jauge{position:relative;width:76px;height:76px;margin:auto}.page-archetype .jauge svg{width:100%;height:100%;transform:rotate(-90deg)}.page-archetype .jauge circle{fill:none;stroke-width:6}.page-archetype .jauge .fond{stroke:rgba(23,42,77,.10)}.page-archetype .jauge .valeur{stroke:var(--accent);stroke-linecap:round}.page-archetype .jauge strong{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--a-text)}.page-archetype .ligne-confiance{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:9px 0 0;color:var(--a-muted);font-size:9px}.page-archetype .etoiles{color:var(--accent);font-size:15px;letter-spacing:1px}.page-archetype .etoiles-vides{opacity:.25}.page-archetype .bloc-pourquoi{border-left:3px solid var(--accent);border-radius:0 10px 10px 0;background:var(--a-card-soft);padding:10px 11px;margin-top:10px}.page-archetype .bloc-pourquoi .titre{font-size:11px;font-weight:900;margin-bottom:5px;color:var(--a-text)}.page-archetype .resume-preuve{margin:0 0 5px;color:#293B56;font-size:10px;line-height:1.38}.page-archetype .preuve{display:flex;gap:8px;padding:6px 0;border-top:1px solid rgba(23,42,77,.08);font-size:9px;line-height:1.3}.page-archetype .preuve-titre{min-width:105px;color:var(--accent);font-weight:900}.page-archetype .preuve-texte{color:var(--a-muted)}.page-archetype .metriques{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:10px;border-top:1px solid var(--a-line)}.page-archetype .metrique{padding:9px 8px;border-right:1px solid var(--a-line)}.page-archetype .metrique:last-child{border-right:0}.page-archetype .metrique span{display:block;color:var(--a-muted);font-size:9px;font-weight:700}.page-archetype .metrique strong{display:block;font-size:16px;margin-top:3px;color:var(--a-text)}
.page-archetype .details-analyse{margin:5px 16px 13px;border-top:1px solid var(--a-line);padding-top:9px}.page-archetype .details-analyse summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:7px}.page-archetype .details-analyse summary::-webkit-details-marker{display:none}.page-archetype .details-titre{font-size:11px;font-weight:900}.page-archetype .details-sous-titre{display:block;color:var(--a-muted);font-size:9px;margin-top:2px}.page-archetype .chevron{color:var(--af-blue);font-size:17px}.page-archetype .contenu-details{padding-top:7px}.page-archetype .ligne-detail{display:flex;justify-content:space-between;gap:9px;padding:5px 0;border-bottom:1px solid rgba(23,42,77,.07);font-size:9px}.page-archetype .ligne-detail .cle{color:var(--a-muted)}.page-archetype .ligne-detail .val{font-weight:800;text-align:right}.page-archetype .etat-vide{max-width:700px;margin:14px auto;padding:22px 18px;border:1px solid rgba(154,112,27,.20);border-radius:15px;color:var(--a-muted);text-align:center;font-size:12px;background:var(--a-card);box-shadow:0 8px 24px rgba(53,42,24,.08)}
body.theme-nuit .page-archetype{--a-bg:var(--af-night);--a-card:var(--af-night-card);--a-card-soft:#1C1F2B;--a-text:#F4F2F7;--a-muted:#AAA6B2;--a-line:rgba(255,255,255,.11)}body.theme-nuit .page-archetype .header-archetype{border-bottom-color:rgba(255,255,255,.10)!important}body.theme-nuit .page-archetype .marque-archetype p{color:#B9C5E8}body.theme-nuit .page-archetype .ecusson-equipe{background:#171A25;color:#DDE5FF;border-color:rgba(255,255,255,.12)}body.theme-nuit .page-archetype .bloc-horaire{background:#171A25;border-color:rgba(255,255,255,.10)}body.theme-nuit .page-archetype .bouton-repli{background:var(--a-card)}body.theme-nuit .page-archetype .resume-marche,body.theme-nuit .page-archetype .resume-preuve{color:#D7D3DB}body.theme-nuit .page-archetype .jauge .fond{stroke:rgba(255,255,255,.10)}body.theme-nuit .page-archetype .preuve,body.theme-nuit .page-archetype .details-analyse,body.theme-nuit .page-archetype .ligne-detail{border-color:rgba(255,255,255,.08)}
@media(max-width:600px){.page-archetype{padding:10px 5px 24px}.page-archetype .header-archetype{margin-bottom:9px}.page-archetype .ligne-match{grid-template-columns:minmax(0,1fr) 82px minmax(0,1fr);gap:5px}.page-archetype .equipe{font-size:15px;gap:5px}.page-archetype .ecusson-equipe{width:43px;height:43px}.page-archetype .bloc-horaire strong{font-size:19px}.page-archetype .competition{font-size:9px}.page-archetype .selection-tab{font-size:9px;padding:10px 3px}.page-archetype .selection-tab small{font-size:8px}.page-archetype .contenu-carte{padding:14px 12px 6px}.page-archetype .libelle-marche{font-size:22px}.page-archetype .resume-marche{font-size:11px}.page-archetype .cote{font-size:25px}.page-archetype .metrique strong{font-size:14px}.page-archetype .preuve-titre{min-width:88px}}
</style>
