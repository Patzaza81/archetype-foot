<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071E18">
<title>Archetype Foot — Sélections</title>
<link rel="stylesheet" href="style.css">
<style>
.page-archetype{--a-bg:#071e18;--a-surface:#0d2922;--a-surface2:#12342b;--a-text:#f2f4ef;--a-muted:#aab7b1;--p1:#e5b83f;--p2:#20c7ff;--p3:#b96cff;max-width:100%;min-height:100vh;background:var(--a-bg);color:var(--a-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0 10px 60px}
.page-archetype *{box-sizing:border-box}.page-archetype .header-archetype{max-width:980px;margin:auto;padding:18px 8px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.page-archetype .marque-archetype{display:flex;align-items:center;gap:12px}.page-archetype .logo-archetype{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;border:1px solid rgba(229,184,63,.5);background:rgba(229,184,63,.1);color:var(--p1);font-size:24px;font-weight:900}.page-archetype h1{margin:0;font-size:23px;letter-spacing:.08em}.page-archetype .marque-archetype p{margin:3px 0 0;color:var(--a-muted);font-size:11px}.page-archetype .nav-bouton{display:inline-block;margin-top:12px;color:var(--a-muted);text-decoration:none}.page-archetype .maj-archetype{margin-top:10px;color:var(--p1);font-weight:800;font-size:13px}
.page-archetype .flux-selections{max-width:980px;margin:auto;padding:16px 0}.page-archetype .carte-match{margin:0 0 26px;border:1px solid rgba(255,255,255,.11);border-radius:28px;overflow:hidden;background:linear-gradient(145deg,#12352a,#081f18);box-shadow:0 18px 50px rgba(0,0,0,.22)}
.page-archetype .entete-match{padding:20px 18px 18px;border-bottom:1px solid rgba(255,255,255,.09)}.page-archetype .ligne-match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.page-archetype .equipe{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800}.page-archetype .equipe.exterieur{justify-content:flex-end;text-align:right}.page-archetype .ecusson-equipe{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(229,184,63,.55);background:rgba(229,184,63,.1);color:var(--p1);font-size:12px;font-weight:900}.page-archetype .bloc-horaire{text-align:center;min-width:106px}.page-archetype .bloc-horaire strong{display:block;color:var(--p1);font-size:20px}.page-archetype .bloc-horaire span{display:block;margin-top:3px;color:var(--a-muted);font-size:12px;font-weight:700;text-transform:capitalize}.page-archetype .competition{margin-top:15px;text-align:center;color:var(--a-muted);font-size:12px;font-weight:700}
.page-archetype .selections{padding:16px 14px 8px}.page-archetype .selection{border:1px solid rgba(255,255,255,.11);border-radius:22px;margin:0 0 14px;background:rgba(7,29,23,.68);overflow:hidden}.page-archetype .selection.rang-1{--accent:var(--p1);border-color:rgba(229,184,63,.7)}.page-archetype .selection.rang-2{--accent:var(--p2);border-color:rgba(32,199,255,.62)}.page-archetype .selection.rang-3{--accent:var(--p3);border-color:rgba(185,108,255,.62)}
.page-archetype .selection-inner{padding:18px 16px}.page-archetype .selection-head{display:flex;align-items:center;gap:11px}.page-archetype .icone-rang{width:46px;height:42px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-size:20px;font-weight:900}.page-archetype .rang-titre{color:var(--accent);font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.03em}.page-archetype .rang-sous-titre{color:var(--a-muted);font-size:11px;margin-top:2px}.page-archetype .libelle-marche{font-family:Georgia,"Times New Roman",serif;font-size:27px;line-height:1.14;margin:20px 0 15px}.page-archetype .resume-marche{margin:-5px 0 16px;color:#dce4df;font-size:13px;line-height:1.5}
.page-archetype .donnees-principales{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px}.page-archetype .etiquette{display:block;color:var(--a-muted);font-size:11px;font-weight:700}.page-archetype .cote{font-size:32px;line-height:1;margin-top:5px}.page-archetype .jauge{position:relative;width:98px;height:98px}.page-archetype .jauge svg{width:100%;height:100%;transform:rotate(-90deg)}.page-archetype .jauge circle{fill:none;stroke-width:7}.page-archetype .jauge .fond{stroke:rgba(255,255,255,.11)}.page-archetype .jauge .valeur{stroke:var(--accent);stroke-linecap:round}.page-archetype .jauge strong{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}.page-archetype .ligne-confiance{display:flex;align-items:center;gap:9px;margin:15px 0;color:var(--a-muted);font-size:12px}.page-archetype .etoiles{color:var(--accent);letter-spacing:1px;font-size:17px}.page-archetype .etoiles-vides{opacity:.2}.page-archetype .bloc-pourquoi{border-left:4px solid var(--accent);border-radius:0 16px 16px 0;background:rgba(255,255,255,.045);padding:15px 15px 14px;margin-top:13px}.page-archetype .bloc-pourquoi .titre{font-size:13px;font-weight:900;margin-bottom:9px}.page-archetype .resume-preuve{margin:0 0 10px;color:#eef2ed;font-size:13px;line-height:1.55}.page-archetype .preuve{display:flex;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12px;line-height:1.45}.page-archetype .preuve-titre{min-width:122px;color:var(--accent);font-weight:900}.page-archetype .preuve-texte{color:var(--a-muted)}.page-archetype .metriques{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:15px}.page-archetype .metrique span{display:block;color:var(--a-muted);font-size:10px;font-weight:700}.page-archetype .metrique strong{display:block;font-size:16px;margin-top:3px}
.page-archetype .selection.vide{display:none}.page-archetype .details-analyse{margin:4px 14px 16px;border-top:1px solid rgba(255,255,255,.1);padding-top:15px}.page-archetype .details-analyse summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}.page-archetype .details-analyse summary::-webkit-details-marker{display:none}.page-archetype .details-titre{font-size:14px;font-weight:900}.page-archetype .details-sous-titre{display:block;color:var(--a-muted);font-size:11px;margin-top:3px}.page-archetype .chevron{color:var(--p1);font-size:20px}.page-archetype .contenu-details{padding-top:12px}.page-archetype .ligne-detail{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px}.page-archetype .ligne-detail .cle{color:var(--a-muted)}.page-archetype .ligne-detail .val{font-weight:800;text-align:right}.page-archetype .etat-vide{max-width:700px;margin:25px auto;padding:30px;border:1px solid rgba(255,255,255,.1);border-radius:20px;color:var(--a-muted);text-align:center}
@media(max-width:600px){.page-archetype{padding-left:7px;padding-right:7px}.page-archetype .ligne-match{grid-template-columns:1fr auto 1fr;gap:7px}.page-archetype .equipe{font-size:15px}.page-archetype .ecusson-equipe{width:42px;height:42px}.page-archetype .bloc-horaire{min-width:82px}.page-archetype .bloc-horaire strong{font-size:18px}.page-archetype .libelle-marche{font-size:25px}.page-archetype .selection-inner{padding:17px 14px}.page-archetype .preuve{display:block}.page-archetype .preuve-titre{display:block;margin-bottom:3px}.page-archetype .donnees-principales{grid-template-columns:1fr auto}}
</style>
</head>

<header class="header-archetype"><div class="marque-archetype"><div class="logo-archetype" aria-hidden="true">A</div><div><h1>ARCHETYPE</h1><p>Des analyses puissantes pour de meilleures décisions</p></div></div><a href="index.html" class="nav-bouton">← Accueil</a><div id="maj" class="maj-archetype">Chargement…</div></header>
<main id="matches" class="flux-selections"></main>
<script src="traduction_marches.js"></script><script src="archetype.js"></script>
</body>
</html>
