.page-archetype{--a-bg:var(--af-cream);--a-surface:#FDFBF7;--a-surface2:#F1F3FF;--a-text:#17141B;--a-muted:#756F78;--p1:var(--af-gold);--p2:var(--af-blue);--p3:var(--af-blue-violet);max-width:100%;min-height:100vh;background:var(--a-bg);color:var(--a-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0 6px 30px}
.page-archetype *{box-sizing:border-box}.page-archetype .header-archetype{max-width:760px;margin:auto;padding:9px 5px 7px;border-bottom:1px solid rgba(49,92,255,.16);background:linear-gradient(135deg,rgba(49,92,255,.08),rgba(101,71,232,.08))}.page-archetype .marque-archetype{display:flex;align-items:center;gap:8px}.page-archetype .logo-archetype{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;border:1px solid rgba(154,112,27,.6);background:rgba(154,112,27,.09);color:var(--p1);font-size:17px;font-weight:900}.page-archetype h1{margin:0;font-size:23px;letter-spacing:.09em;color:var(--p1)}.page-archetype .marque-archetype p{margin:1px 0 0;color:var(--a-muted);font-size:9px}.page-archetype .nav-bouton{display:inline-block;margin-top:6px;color:#fff;text-decoration:none;font-size:12px;background:linear-gradient(135deg,var(--af-blue),var(--af-blue-violet));border:0;border-radius:999px;padding:6px 10px;box-shadow:0 4px 12px rgba(49,92,255,.14)}.page-archetype .maj-archetype{margin-top:5px;color:var(--p1);font-weight:800;font-size:11px}.page-archetype .flux-selections{max-width:760px;margin:auto;padding:6px 0}.page-archetype .carte-match{margin:0 0 9px;border:1px solid var(--af-border,rgba(23,20,27,.10));border-radius:14px;overflow:hidden;background:var(--a-surface);box-shadow:0 8px 22px rgba(23,20,27,.07)}.page-archetype .entete-match{position:relative;padding:9px 10px 37px;border-bottom:1px solid rgba(23,20,27,.09)}.page-archetype .ligne-match{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:5px}.page-archetype .equipe{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;min-width:0;color:var(--a-text)}.page-archetype .equipe span:last-child{overflow-wrap:anywhere}.page-archetype .equipe.exterieur{justify-content:flex-end;text-align:right}.page-archetype .ecusson-equipe{width:31px;height:31px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(49,92,255,.28);background:rgba(49,92,255,.07);color:var(--af-blue);font-size:9px;font-weight:900}.page-archetype .bloc-horaire{text-align:center;min-width:55px}.page-archetype .bloc-horaire strong{display:block;color:var(--af-blue);font-size:15px}.page-archetype .bloc-horaire span{display:block;margin-top:1px;color:var(--a-muted);font-size:8px;font-weight:700;text-transform:capitalize}.page-archetype .competition{margin-top:7px;text-align:center;background:#101114;color:#fff;border-radius:5px;padding:5px 7px;font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.page-archetype .bouton-repli{position:absolute;right:9px;bottom:7px;border:1px solid rgba(49,92,255,.18);border-radius:999px;background:rgba(49,92,255,.06);color:var(--af-blue);padding:4px 8px;font-size:9px;font-weight:800;cursor:pointer}.page-archetype .carte-repliee .contenu-carte,.page-archetype .carte-repliee .details-analyse{display:none}.page-archetype .carte-repliee .entete-match{border-bottom:0}.page-archetype .selections{padding:7px 7px 1px}.page-archetype .selection{border:1px solid rgba(23,20,27,.10);border-radius:11px;margin:0 0 6px;background:#FFFCF6;overflow:hidden}.page-archetype .selection.rang-1{--accent:var(--af-gold);border-color:rgba(154,112,27,.55)}.page-archetype .selection.rang-2{--accent:var(--af-blue);border-color:rgba(49,92,255,.35)}.page-archetype .selection.rang-3{--accent:var(--af-blue-violet);border-color:rgba(101,71,232,.35)}.page-archetype .selection-inner{padding:9px 10px}.page-archetype .selection-head{display:flex;align-items:center;gap:7px}.page-archetype .icone-rang{width:29px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);font-size:14px;font-weight:900}.page-archetype .rang-titre{color:var(--accent);font-size:10px;font-weight:900;text-transform:uppercase}.page-archetype .rang-sous-titre{color:var(--a-muted);font-size:8px;margin-top:1px}.page-archetype .libelle- margin-top:2px;color:var(--a-text)}.page-archetype .details-analyse{margin:3px 8px 8px;border-top:1px solid rgba(23,20,27,.10);padding-top:7px}.page-archetype .details-analyse summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:7px}.page-archetype .details-analyse summary::-webkit-details-marker{display:none}.page-archetype .details-titre{font-size:10px;font-weight:900}.page-archetype .details-sous-titre{display:block;color:var(--a-muted);font-size:8px;margin-top:1px}.page-archetype .chevron{color:var(--af-blue);font-size:15px}.page-archetype .contenu-details{padding-top:6px}.page-archetype .ligne-detail{display:flex;justify-content:space-between;gap:9px;padding:4px 0;border-bottom:1px solid rgba(23,20,27,.07);font-size:8px}.page-archetype .ligne-detail .cle{color:var(--a-muted)}.page-archetype .ligne-detail .val{font-weight:800;text-align:right}.page-archetype .etat-vide{max-width:700px;margin:14px auto;padding:18px;border:1px solid rgba(23,20,27,.10);border-radius:13px;color:var(--a-muted);text-align:center;font-size:11px;background:var(--a-surface)}
body.theme-nuit .page-archetype{--a-bg:var(--af-night);--a-surface:var(--af-night-card);--a-text:#F4F2F7;--a-muted:#AAA6B2}body.theme-nuit .page-archetype .carte-match{border-color:rgba(255,255,255,.10);box-shadow:0 8px 22px rgba(0,0,0,.22)}body.theme-nuit .page-archetype .entete-match{border-bottom-color:rgba(255,255,255,.10)}body.theme-nuit .page-archetype .selection{background:#131722;border-color:rgba(255,255,255,.10)}body.theme-nuit .page-archetype .ecusson-equipe{background:rgba(49,92,255,.10)}body.theme-nuit .page-archetype .bloc-pourquoi{background:#1B1D28}body.theme-nuit .page-archetype .jauge .fond{stroke:rgba(255,255,255,.10)}body.theme-nuit .page-archetype .resume-marche,body.theme-nuit .page-archetype .resume-preuve{color:#D0CCD5}body.theme-nuit .page-archetype .preuve,body.theme-nuit .page-archetype .details-analyse,body.theme-nuit .page-archetype .ligne-detail{border-color:rgba(255,255,255,.08)}
