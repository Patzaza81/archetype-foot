<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F7F1E7">
<title>Archetype Foot — Sélections</title>
<link rel="stylesheet" href="style.css">
<style>
.page-archetype{--a-bg:#F7F1E7;--a-surface:#FFFDF8;--a-surface2:#F1E9FA;--a-text:#241B35;--a-muted:#756B7D;--p1:#D4A72C;--p2:#7C3AED;--p3:#D946EF;max-width:100%;min-height:100vh;background:var(--a-bg);color:var(--a-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0 8px 40px}
.page-archetype *{box-sizing:border-box}.page-archetype .header-archetype{max-width:760px;margin:auto;padding:14px 6px 12px;border-bottom:1px solid rgba(124,58,237,.16);background:linear-gradient(135deg,rgba(79,70,229,.08),rgba(217,70,239,.08))}
.page-archetype .marque-archetype{display:flex;align-items:center;gap:10px}.page-archetype .logo-archetype{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid rgba(212,167,44,.55);background:rgba(212,167,44,.10);color:var(--p1);font-size:21px;font-weight:900}.page-archetype h1{margin:0;font-size:20px;letter-spacing:.07em;color:var(--p1)}.page-archetype .marque-archetype p{margin:2px 0 0;color:var(--a-muted);font-size:10px}.page-archetype .nav-bouton{display:inline-block;margin-top:9px;color:#fff;text-decoration:none;font-size:13px;background:linear-gradient(135deg,#4F46E5,#D946EF);border:1px solid transparent;border-radius:999px;padding:7px 12px;box-shadow:0 5px 14px rgba(124,58,237,.16)}.page-archetype .maj-archetype{margin-top:8px;color:var(--p1);font-weight:800;font-size:12px}
.page-archetype .flux-selections{max-width:760px;margin:auto;padding:10px 0}.page-archetype .carte-match{margin:0 0 12px;border:1px solid rgba(64,38,91,.12);border-radius:18px;overflow:hidden;background:var(--a-surface);box-shadow:0 8px 24px rgba(61,38,84,.08)}
.page-archetype .entete-match{position:relative;padding:12px 12px 43px;border-bottom:1px solid rgba(64,38,91,.10)}.page-archetype .ligne-match{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px}.page-archetype .equipe{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;min-width:0}.page-archetype .equipe span:last-child{overflow-wrap:anywhere}.page-archetype .equipe.exterieur{justify-content:flex-end;text-align:right}.page-archetype .ecusson-equipe{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(124,58,237,.28);background:#F1E9FA;color:#7C3AED;font-size:10px;font-weight:900}.page-archetype .bloc-horaire{text-align:center;min-width:58px}.page-archetype .bloc-horaire strong{display:block;color:#7C3AED;font-size:16px}.page-archetype .bloc-horaire span{display:block;margin-top:2px;color:var(--a-muted);font-size:9px;font-weight:700;text-transform:capitalize}.page-archetype .competition{margin-top:9px;text-align:center;color:#7C3AED;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-archetype .bouton-repli{position:absolute;right:10px;bottom:8px;border:1px solid rgba(124,58,237,.18);border-radius:999px;background:#F1E9FA;color:#5B21B6;padding:5px 9px;font-size:10px;font-weight:800;cursor:pointer}.page-archetype .carte-repliee .contenu-carte,.page-archetype .carte-repliee .details-analyse{display:none}.page-archetype .carte-repliee .entete-match{border-bottom:0}
.page-archetype .selections{padding:9px 9px 2px}.page-archetype .selection{border:1px solid rgba(64,38,91,.11);border-radius:14px;margin:0 0 8px;background:#FFFCF6;overflow:hidden}.page-archetype .selection.rang-1{--accent:var(--p1);border-color:rgba(212,167,44,.55)}.page-archetype .selection.rang-2{--accent:var(--p2);border-color:rgba(124,58,237,.35)}.page-archetype .selection.rang-3{--accent:var(--p3);border-color:rgba(217,70,239,.35)}
.page-archetype .selection-inner{padding:10px 11px}.page-archetype .selection-head{display:flex;align-items:center;gap:8px}.page-archetype .icone-rang{width:32px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-size:15px;font-weight:900}.page-archetype .rang-titre{color:var(--accent);font-size:11px;font-weight:900;text-transform:uppercase}.page-archetype .rang-sous-titre{color:var(--a-muted);font-size:9px;margin-top:1px}.page-archetype .libelle-marche{font-family:Georgia,"Times New Roman",serif;color:#241B35;font-size:18px;line-height:1.12;margin:9px 0 7px}.page-archetype .resume-marche{margin:-1px 0 8px;color:#5F5667;font-size:10px;line-height:1.35}.page-archetype .donnees-principales{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.page-archetype .etiquette{display:block;color:var(--a-muted);font-size:9px;font-weight:700}.page-archetype .cote{font-size:22px;line-height:1;margin-top:3px;color:#7C3AED}.page-archetype .jauge{position:relative;width:58px;height:58px}.page-archetype .jauge svg{width:100%;height:100%;transform:rotate(-90deg)}.page-archetype .jauge circle{fill:none;stroke-width:6}.page-archetype .jauge .fond{stroke:rgba(64,38,91,.10)}.page-archetype .jauge .valeur{stroke:var(--accent);stroke-linecap:round}.page-archetype .jauge strong{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#241B35}.page-archetype .ligne-confiance{display:flex;align-items:center;gap:6px;margin:7px 0;color:var(--a-muted);font-size:9px}.page-archetype .etoiles{color:var(--accent);letter-spacing:0;font-size:12px}.page-archetype .etoiles-vides{opacity:.2}.page-archetype .bloc-pourquoi{border-left:3px solid var(--accent);border-radius:0 10px 10px 0;background:#F7F0FA;padding:8px 9px;margin-top:7px}.page-archetype .bloc-pourquoi .titre{font-size:10px;font-weight:900;margin-bottom:5px}.page-archetype .resume-preuve{margin:0 0 5px;color:#3F3549;font-size:10px;line-height:1.35}.page-archetype .preuve{display:flex;gap:7px;padding:5px 0;border-top:1px solid rgba(64,38,91,.08);font-size:9px;line-height:1.3}.page-archetype .preuve-titre{min-width:90px;color:var(--accent);font-weight:900}.page-archetype .preuve-texte{color:var(--a-muted)}.page-archetype .metriques{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:7px}.page-archetype .metrique span{display:block;color:var(--a-muted);font-size:8px;font-weight:700}.page-archetype .metrique strong{display:block;font-size:12px;margin-top:2px;color:#241B35}
.page-archetype .details-analyse{margin:3px 9px 9px;border-top:1px solid rgba(64,38,91,.10);padding-top:8px}.page-archetype .details-analyse summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}.page-archetype .details-analyse summary::-webkit-details-marker{display:none}.page-archetype .details-titre{font-size:11px;font-weight:900}.page-archetype .details-sous-titre{display:block;color:var(--a-muted);font-size:9px;margin-top:2px}.page-archetype .chevron{color:#7C3AED;font-size:16px}.page-archetype .contenu-details{padding-top:7px}.page-archetype .ligne-detail{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(64,38,91,.07);font-size:9px}.page-archetype .ligne-detail .cle{color:var(--a-muted)}.page-archetype .ligne-detail .val{font-weight:800;text-align:right}.page-archetype .etat-vide{max-width:700px;margin:18px auto;padding:22px;border:1px solid rgba(64,38,91,.10);border-radius:15px;color:var(--a-muted);text-align:center;font-size:12px;background:var(--a-surface)}
@media(min-width:601px){.page-archetype .selection-inner{padding:13px 14px}.page-archetype .libelle-marche{font-size:21px}.page-archetype .jauge{width:68px;height:68px}}
</style>
</head>

<main id="matches" class="flux-selections"></main>

</body>
</html>
