<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071E18">
<title>Archetype Foot — Panier</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Réglages propres à cette page uniquement, sans couleur codée en dur. */
  #retour-accueil { display: inline-block; margin-bottom: 12px; margin-right: 8px; }
  #copie-fallback { display: none; width: 100%; box-sizing: border-box; margin-bottom: 16px;
                     min-height: 70px; font-family: monospace; font-size: 13px; }
  #statut-analyse-panier { padding: 0 0 16px; font-size: 14px; }
  /* .bouton-secondaire n'a pas de marge en haut par défaut -- ce bouton-ci
     suit le statut d'analyse, il lui faut un espace au-dessus. */
  #tout-copier-btn { margin-top: 16px; }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <h1>Archetype Foot — Panier</h1>
  </div>
</header>
<main>
  <a id="retour-accueil" href="index.html" class="nav-bouton">← Accueil</a>
  <div id="liste-panier"></div>

  <button id="analyser-panier-btn" class="bouton-principal">🔬 Analyser tout le panier (0)</button>
  <div id="statut-analyse-panier"></div>

  <button id="tout-copier-btn" class="bouton-secondaire">Tout copier (0)</button>
  <textarea id="copie-fallback" readonly placeholder="Si la copie automatique échoue, le JSON apparaît ici -- sélectionne-le à la main."></textarea>

  <p style="padding: 12px; opacity: 0.7; font-size: 0.9em;">
    "Analyser tout le panier" envoie la liste entière en un seul run
    GitHub Actions. "Tout copier" reste disponible en secours si tu
    préfères coller le JSON toi-même dans <code>panier.json</code> sur
    GitHub.
  </p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="panier.js"></script>
</body>
</html>
