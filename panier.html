<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1115">
<title>Archetype Foot — Panier</title>
<link rel="stylesheet" href="style.css">
<style>
  #retour-accueil, #retour-betpawa { display: inline-block; margin-bottom: 12px; margin-right: 8px; }
  .item-panier { display: flex; align-items: center; justify-content: space-between;
                 padding: 10px 12px; border-bottom: 1px solid #2a2d34; }
  .item-panier .tag { font-size: 0.72em; opacity: 0.6; margin-left: 6px; display: block; }
  .item-panier button { background: none; border: none; color: #ef4444; font-size: 1.2em;
                         cursor: pointer; padding: 4px 8px; }
  .vide { padding: 16px; opacity: 0.6; text-align: center; }
  #tout-copier-btn { display: block; width: 100%; margin: 16px 0 8px 0; padding: 14px;
                      background: #2563eb; color: white; border: none; border-radius: 6px;
                      font-size: 1em; font-weight: bold; cursor: pointer; }
  #tout-copier-btn.copie { background: #16a34a; }
  #analyser-panier-btn { display: block; width: 100%; margin: 0 0 16px 0; padding: 14px;
                      background: #7c3aed; color: white; border: none; border-radius: 6px;
                      font-size: 1em; font-weight: bold; cursor: pointer; }
  #analyser-panier-btn:disabled { opacity: 0.5; cursor: default; }
  #statut-analyse-panier { padding: 0 0 16px 0; font-size: 0.9em; }
  #statut-analyse-panier.ok { color: #14b8a6; }
  #statut-analyse-panier.erreur { color: #ef4444; }
  #copie-fallback { display: none; width: 100%; box-sizing: border-box; margin-bottom: 16px;
                     min-height: 70px; font-family: monospace; font-size: 0.8em; }
  #ajout-manuel { margin-top: 24px; padding: 12px; border: 1px solid #2a2d34; border-radius: 6px; }
  #ajout-manuel h2 { font-size: 1em; margin: 0 0 10px 0; }
  #ajout-manuel input { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 8px;
                         background: #1a1c22; border: 1px solid #2a2d34; color: inherit; border-radius: 4px; }
  #ajout-manuel button { padding: 10px 14px; background: #14b8a6; color: #0f1115; border: none;
                          border-radius: 6px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <h1>Archetype Foot — Panier</h1>
  </div>
</header>
<main>
  <a id="retour-accueil" href="index.html" class="nav-bouton">← Accueil</a>
  <a id="retour-betpawa" href="betpawa.html" class="nav-bouton">⚽ Betpawa</a>
  <div id="liste-panier"></div>

  <button id="analyser-panier-btn">🔬 Analyser tout le panier (0)</button>
  <div id="statut-analyse-panier"></div>

  <button id="tout-copier-btn">Tout copier (0)</button>
  <textarea id="copie-fallback" readonly placeholder="Si la copie automatique échoue, le JSON apparaît ici -- sélectionne-le à la main."></textarea>

  <div id="ajout-manuel">
    <h2>Ajouter un match hors liste</h2>
    <input id="manuel-url" type="text" placeholder="URL matchendirect.fr complète (ex. https://www.matchendirect.fr/live-score/psg-om_xxxxx.html)">
    <input id="manuel-domicile" type="text" placeholder="Équipe domicile (ex. PSG)">
    <input id="manuel-exterieur" type="text" placeholder="Équipe extérieur (ex. OM)">
    <input id="manuel-competition" type="text" placeholder="Compétition (ex. France : Ligue 1 McDonald's)">
    <button id="ajouter-manuel-btn">Ajouter au panier</button>
  </div>

  <p style="padding: 12px; opacity: 0.7; font-size: 0.9em;">
    "Analyser tout le panier" envoie la liste entière en un seul run
    GitHub Actions. "Tout copier" reste disponible en secours si tu
    préfères coller le JSON toi-même dans <code>panier.json</code> sur
    GitHub.
  </p>
</main>
<!-- (30/08/2026 -- DIAGNOSTIC TEMPORAIRE, à retirer une fois le vrai bug
     trouvé) Affiche directement sur la page toute erreur JavaScript qui
     empêcherait panier.js de finir de s'exécuter -- sur iPhone sans Mac,
     impossible d'ouvrir la vraie console développeur, donc on la simule
     ici pour voir le message d'erreur réel au lieu de deviner. -->
<div id="diagnostic-erreur" style="display:none; position:fixed; bottom:0; left:0; right:0;
     background:#7f1d1d; color:#fff; padding:14px; font-family:monospace; font-size:0.8em;
     z-index:9999; max-height:40vh; overflow:auto; white-space:pre-wrap;"></div>
<script>
  window.addEventListener("error", function (evenement) {
    const zone = document.getElementById("diagnostic-erreur");
    zone.style.display = "block";
    zone.textContent = "ERREUR JS -- " + evenement.message +
      "\nFichier : " + evenement.filename +
      "\nLigne : " + evenement.lineno + ", colonne : " + evenement.colno +
      (evenement.error && evenement.error.stack ? "\n\n" + evenement.error.stack : "");
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="panier.js"></script>
</body>
</html>
